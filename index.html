<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Courtesan</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f0b09">
<style>
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-display: swap; src: url(fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-display: swap; src: url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 700; font-display: swap; src: url(fonts/cormorant-garamond-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 400; font-display: swap; src: url(fonts/eb-garamond-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: italic; font-display: swap; src: url(fonts/eb-garamond-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-display: swap; src: url(fonts/eb-garamond-latin-500-normal.woff2) format("woff2"); }
  :root {
    --bg: #0f0b09;
    --card: #1c1511;
    --card2: #251c16;
    --line: #382a20;
    --line2: #5a4431;
    --ink: #efe3d3;
    --ink2: #c8b59d;
    --mute: #8f7a63;
    --gold: #e2bf7a;
    --c-coin: #e2bf7a;
    --c-rep: #d98ab0;
    --c-fame: #f0d48a;
    --c-energy: #e8a65a;
    --c-health: #8cc28f;
    --c-stress: #e0705a;
    --c-control: #6fb6b0;
    --c-trauma: #a68ad9;
    --c-xp: #c9b3ff;
    --good: #8cc28f;
    --mid: #e8b65a;
    --bad: #e0705a;
    --r: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1100px 600px at 50% -220px, #2c1b12 0%, var(--bg) 62%) fixed var(--bg);
    color: var(--ink);
    font: 17px/1.5 "EB Garamond", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 600px; margin: 0 auto; padding: 0 14px 96px; min-height: 100vh; }

  /* HUD */
  .hud { position: sticky; top: 0; z-index: 5; padding: 10px 0 6px; background: linear-gradient(var(--bg) 78%, transparent); }
  .hud-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .brand { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: 1.2rem; color: var(--gold); letter-spacing: .04em; }
  .when { font-size: .82rem; color: var(--ink2); text-align: right; }
  .purse { display: flex; gap: 14px; flex-wrap: wrap; font-size: .84rem; color: var(--mute); margin: 2px 0 8px; }
  .purse b { font-weight: 500; }
  .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .m { font-size: .66rem; color: var(--mute); text-transform: uppercase; letter-spacing: .07em; }
  .m .row { display: flex; justify-content: space-between; }
  .m .row span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: #2b211b; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .fill { height: 100%; border-radius: 3px; transition: width .35s ease; }
  .deltas { min-height: 24px; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .delta { font-size: .74rem; padding: 1px 9px; border-radius: 999px; background: #241a14; border: 1px solid var(--line); animation: pop 3s ease forwards; font-variant-numeric: tabular-nums; }
  .delta.good { color: var(--good); } .delta.bad { color: var(--bad); }
  @keyframes pop { 0% { opacity: 0; transform: translateY(4px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* Scene */
  .scene { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 14px; margin: 4px 0 12px; box-shadow: 0 12px 30px #0007; animation: fade .25s ease; }
  @keyframes fade { from { opacity: .3; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .kicker { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .scene h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.6rem; margin: 2px 0 8px; color: var(--gold); font-weight: 600; line-height: 1.12; }
  .body { white-space: pre-line; }
  .act { display: flex; align-items: center; gap: 12px; margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; background: #160f0c; }
  .act-ico svg { width: 42px; height: 42px; stroke: var(--gold); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .act-txt { flex: 1; min-width: 0; }
  .act-k { font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .act-n { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.2rem; line-height: 1.15; }
  .act-p { font-size: .8rem; color: var(--ink2); }
  .mast { font-family: "EB Garamond", Georgia, serif; font-size: .7rem; color: var(--gold); border: 1px solid #7a6232; border-radius: 999px; padding: 0 6px; vertical-align: middle; }
  .heat { display: flex; gap: 1px; }
  .heat svg { width: 15px; height: 15px; stroke: #5a4431; fill: none; stroke-width: 1.6; display: block; }
  .heat .on svg { stroke: var(--c-stress); fill: #e0705a55; }
  .party { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 8px; }
  .pm { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: .8rem; }
  .pm.on { border-color: var(--gold); background: #22180f; }
  .pm.done { opacity: .55; }
  .pmt { flex: 1; min-width: 0; } .pmm { color: var(--mute); font-size: .72rem; }
  .pm .track { margin: 2px 0; }
  .av { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; color: #0f0b09; }
  .av.male { background: #8fb4d9; } .av.female { background: #d98ab0; }
  .speech { position: relative; margin: 4px 0 12px; padding: 10px 14px; background: #2a1f17; border: 1px solid var(--line2); border-radius: 12px 12px 12px 3px; font-style: italic; color: var(--ink); }
  .body em { color: var(--ink2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { font-size: .74rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink2); }
  .chip.like { border-color: #4f7a52; color: #a9d6ab; }
  .chip.dislike { border-color: #7a4a3f; color: #e7a291; }
  .chip.gold { border-color: #7a6232; color: var(--gold); }
  .chip.warn { border-color: #7a3a2f; color: #eaa08f; }
  .chip.calm { border-color: #2f5d59; color: #9fd3cd; }
  .chip.chip-tap { cursor: pointer; user-select: none; }
  .chip.chip-tap:active { opacity: .75; }
  .chip.chip-open { border-color: var(--ink2); color: var(--ink); background: var(--card2); }
  .tech-detail { width: 100%; margin: 4px 0 8px; padding: 10px 14px; background: var(--card2); border-left: 2px solid var(--line2); border-radius: 4px; font-size: .82rem; color: var(--ink2); font-style: italic; line-height: 1.55; }
  .tech-detail p { margin: 0; }
  .bigmeter { margin-top: 14px; }
  .bigmeter .lbl { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink2); }
  .bigmeter .track { height: 10px; border-radius: 5px; }
  .pips { display: flex; gap: 4px; margin-top: 8px; }
  .pip { flex: 1; height: 4px; background: #3a2c22; border-radius: 2px; }
  .pip.on { background: var(--gold); }
  .roll { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #140f0c; border-left: 3px solid var(--mute); font-size: .86rem; }
  .roll.ok { border-left-color: var(--good); } .roll.no { border-left-color: var(--bad); }
  .roll .res { font-weight: 500; } .roll.ok .res { color: var(--good); } .roll.no .res { color: var(--bad); }
  .roll .math { color: var(--mute); font-variant-numeric: tabular-nums; }
  .die { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: 8px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: 1.15rem; background: #22180f; color: var(--gold); animation: tumble .5s cubic-bezier(.2,.8,.3,1.2); }
  .die.ghost { opacity: .45; width: 26px; height: 26px; font-size: .9rem; animation: none; }
  @keyframes tumble { 0% { transform: rotate(-220deg) scale(.5); opacity: 0; } 100% { transform: none; opacity: 1; } }

  /* Choices */
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .sect { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 8px 2px -2px; }
  .btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: var(--r); padding: 11px 13px; font: inherit; cursor: pointer; transition: background .15s, border-color .15s, transform .06s; }
  .btn:hover:not(:disabled) { background: #2a1f19; border-color: var(--line2); }
  .btn:active:not(:disabled) { transform: scale(.985); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn .txt { flex: 1; min-width: 0; }
  .btn .lbl { display: block; }
  .btn .hint { display: block; font-size: .8rem; color: var(--mute); line-height: 1.35; margin-top: 1px; }
  .btn.primary { border-color: #7a6232; background: linear-gradient(180deg, #382816, #261b12); }
  .btn.primary .lbl { color: var(--gold); }
  .btn.danger .lbl { color: #eaa08f; }
  .btn.quiet { background: transparent; }
  .odds { flex: none; font-size: .78rem; font-variant-numeric: tabular-nums; padding: 2px 9px; border-radius: 999px; border: 1px solid; }
  .odds.hi { color: var(--good); border-color: #3f6542; }
  .odds.md { color: var(--mid); border-color: #6b5228; }
  .odds.lo { color: var(--bad); border-color: #6b3328; }
  .price { flex: none; font-size: .82rem; color: var(--gold); font-variant-numeric: tabular-nums; }
  /* Action button accent borders by kind */
  .btn-work  { border-left: 3px solid #c9993a; }
  .btn-focus { border-left: 3px solid #c9993a; }
  .btn-tease { border-left: 3px solid #9b80c4; }
  .btn-undress { border-left: 3px solid #9b80c4; }
  .btn-strip { border-left: 3px solid #9b80c4; }
  .btn-rush  { border-left: 3px solid #9b80c4; }
  .btn-recover { border-left: 3px solid #5da8c0; }
  .btn-command { border-left: 3px solid #c45a5a; }
  .btn-together { border-left: 3px solid #c9993a; }
  /* Drink / substance bar */
  .drink-bar { margin-top: 8px; }
  .drink-bar .lbl { display: flex; justify-content: space-between; font-size: .76rem; color: #d98ab0; margin-bottom: 3px; }
  .drink-bar .track { height: 8px; border-radius: 4px; background: #3a1e2c; }
  .drink-bar .fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #c45a8a, #e07aaa); transition: width .4s; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 .btn { padding: 9px 10px; }
  /* Body visualization */
  .body-viz { display: flex; align-items: center; gap: 14px; margin: 12px 0 8px; padding: 12px 14px; background: #100b08; border: 1px solid var(--line); border-radius: 10px; }
  .body-viz-fig { position: relative; flex: none; }
  .body-viz-fig img.fig-icon { width: 96px; height: 128px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .body-viz { display: flex; align-items: flex-start; gap: 12px; }
  .body-viz.has-img { flex-direction: row; }
  .viz-pos-img { flex-shrink: 0; width: 100px; height: 100px; border-radius: 8px; overflow: hidden; background: var(--surface2); border: 1px solid var(--border); }
  .viz-pos-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .viz-pos-img.climax-flash img { animation: climax-flare 0.4s ease-in-out; }
  /* portrait system */
  .portrait-wrap { display:flex; align-items:flex-start; gap:14px; margin-bottom:10px; }
  .portrait-img { width:88px; height:110px; border-radius:8px; object-fit:cover; border:2px solid var(--border); flex-shrink:0; background:var(--surface2); display:block; }
  .portrait-placeholder { width:88px; height:110px; border-radius:8px; border:2px dashed var(--border); flex-shrink:0; background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:.75rem; text-align:center; padding:6px; box-sizing:border-box; cursor:pointer; }
  .portrait-placeholder:hover { border-color:var(--gold); color:var(--gold); }
  .portrait-meta { flex:1; min-width:0; }
  .portrait-upload-btn { margin-top:6px; font-size:.8rem; color:var(--mute); cursor:pointer; text-decoration:underline; }
  .portrait-upload-btn:hover { color:var(--gold); }
  .npc-portrait { width:40px; height:50px; border-radius:5px; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
  .npc-portrait-placeholder { width:40px; height:50px; border-radius:5px; border:1px solid var(--border); background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:1.2rem; flex-shrink:0; }
  .staff-inner { display:flex; gap:10px; align-items:flex-start; }
  .staff-body { flex:1; min-width:0; }
  .body-viz-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .viz-pos-label { font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .viz-pos-name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; line-height: 1.2; }
  .viz-arousal-label { font-size: .78rem; color: var(--ink2); margin-top: 2px; }
  .viz-dress-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .viz-dress-tag { font-size: .7rem; padding: 1px 8px; border-radius: 999px; border: 1px solid; }
  .viz-dress-tag.patron { border-color: #7a6232; color: #c9993a; background: #1e1509; }
  .viz-dress-tag.self { border-color: #5a4a7a; color: #9b80c4; background: #100e18; }
  @keyframes arousal-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  .fig-hot { animation: arousal-pulse 1.1s ease-in-out infinite; }
  /* Climax overlay flash */
  @keyframes climax-flare { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: .85; } 100% { opacity: 0; } }
  @keyframes climax-pulse { 0%, 100% { opacity: .9; } 50% { opacity: .5; } }
  @keyframes climax-spill { 0% { transform: translateY(0) scaleY(1); opacity: 1; } 100% { transform: translateY(6px) scaleY(1.4); opacity: 0; } }
  .climax-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; animation: climax-flare 2.2s ease-out forwards; }
  .climax-overlay svg { width: 96px; height: 128px; }
  .climax-closeup-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; animation: climax-flare 2.2s ease-out forwards; }
  .climax-closeup-overlay svg { display: block; }
  .fig-climax { animation: climax-pulse .6s ease-in-out infinite; }
  .climax-text { background: linear-gradient(135deg, #1a0c0c 0%, #2a1010 100%); border: 1px solid #8b1a1a66; border-radius: 6px; padding: 8px 10px; margin-top: 6px; font-size: .82rem; color: #ff8080; line-height: 1.45; font-style: italic; }
  .climax-text strong { color: #ff3a5a; font-style: normal; }
  /* Close-up detail panel */
  .body-viz-closeup { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .closeup-label { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
  .closeup-fig { display: block; background: #0c0907; border: 1px solid #2a1e18; border-radius: 6px; padding: 4px; }
  .closeup-fig img { display: block; width: 96px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; }
  @keyframes closeup-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .closeup-hot { animation: closeup-pulse 1.1s ease-in-out infinite; }

  /* Panels */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 4px 0 12px; animation: fade .25s ease; }
  .panel h3 { font-family: "Cormorant Garamond", Georgia, serif; color: var(--gold); margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
  .panel .sub { color: var(--mute); font-size: .85rem; margin: -4px 0 10px; }
  .panel .choices { margin-top: 10px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .92rem; }
  .kv > span:nth-child(odd) { color: var(--ink2); }
  .kv > span:nth-child(even) { font-variant-numeric: tabular-nums; }
  .bar-row { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: .88rem; margin: 6px 0; }
  .bar-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .attrs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .attr { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; }
  .attr .k { font-size: .66rem; letter-spacing: .1em; color: var(--mute); }
  .attr .v { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.35rem; color: var(--gold); line-height: 1.1; }
  .attr .mod { font-size: .72rem; color: var(--ink2); }
  .feat { margin: 6px 0; font-size: .9rem; }
  .feat b { font-weight: 500; color: var(--ink); }
  .feat span { color: var(--mute); }
  .req { display: grid; grid-template-columns: 18px 1fr 70px; gap: 8px; align-items: center; font-size: .9rem; margin: 6px 0; }
  .req .ok { color: var(--good); } .req .no { color: var(--mute); }
  .req .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .staff { border-top: 1px solid var(--line); padding: 8px 0; }
  .staff:first-of-type { border-top: 0; }
  .staff .top { display: flex; justify-content: space-between; font-size: .92rem; }
  .entry { padding: 7px 0; border-top: 1px solid var(--line); font-size: .9rem; white-space: pre-line; }
  .entry:first-child { border-top: 0; }
  .entry .when { text-align: left; font-size: .7rem; color: var(--mute); letter-spacing: .06em; text-transform: uppercase; }
  .entry.roll-entry { font-size: .8rem; color: var(--ink2); }
  .empty { color: var(--mute); font-style: italic; font-size: .9rem; }
  .steps { display: flex; gap: 3px; margin: 14px 0 2px; }
  .steps span { flex: 1; height: 3px; border-radius: 2px; background: #3a2c22; }
  .steps span.done { background: #7a6232; } .steps span.on { background: var(--gold); }
  .field { display: block; margin-top: 14px; }
  .field span { display: block; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }
  .name-in { width: 100%; background: #140f0c; border: 1px solid var(--line2); border-radius: 8px; color: var(--ink); font: inherit; font-size: 1.15rem; padding: 10px 12px; }
  .name-in:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .sheet { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .sheet .attrs { grid-template-columns: repeat(6, 1fr) !important; gap: 4px; }
  .sheet .attr { padding: 4px 1px; }
  .sheet .attr .v { font-size: 1.1rem; }
  .sheet .chips { margin-top: 8px; }
  .sk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px 8px; margin-top: 10px; font-size: .76rem; color: var(--mute); }
  .sk b { color: var(--ink2); font-weight: 500; }
  .chg, .chg .v, .chg b { color: var(--gold) !important; }
  .attr.chg, .chip.chg { border-color: #7a6232; }
  @media (max-width: 420px) { .sk { grid-template-columns: repeat(2, 1fr); } }

  /* Tabs */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: #130d0aee; backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabs .inner { display: flex; max-width: 600px; margin: 0 auto; }
  .tab { position: relative; flex: 1; background: none; border: 0; color: var(--mute); padding: 9px 4px 11px; font: inherit; font-size: .76rem; cursor: pointer; letter-spacing: .04em; }
  .tab .ico { display: block; font-size: 1.15rem; line-height: 1.25; }
  .tab.on { color: var(--gold); }
  .tab:disabled { opacity: .3; cursor: not-allowed; }
  .tab .dot { position: absolute; top: 7px; left: 56%; width: 7px; height: 7px; border-radius: 50%; background: var(--c-stress); display: none; }
  .tab.alert .dot { display: block; }

  /* Toast */

function deepMerge(base, over) {
  if (!isPlainObject(base) || !isPlainObject(over)) return over === undefined ? base : over;

// Returning client — someone who remembered you specifically.
// Called once per phase in afterPhase(); chance scales with mastery tier.
// Returns a spec object ready for startEncounter(), or null.
function genRepeatClient() {
  if (state.flags.repeatClient) return null; // already one waiting
  const lim = state.character.limits || [];
  // Gather all positions/kinks the player knows and has Expert+ mastery in
  const candidates = [...INDEX.positions.filter(p => knows(p.id)), ...INDEX.kinks.filter(k => knows(k.id))]
    .filter(x => !lim.includes(x.id))
    .map(x => ({ item: x, tier: masteryTier(x.id) }))
    .filter(x => x.tier >= 2); // Expert (2) or Master (3)
  if (!candidates.length) return null;
  // Chance per phase: Expert 20%, Master 35%
  const roll = Math.random();
  const threshold = candidates.some(c => c.tier >= 3) ? 0.35 : 0.20;
  if (roll > threshold) return null;
  // Pick highest-tier candidate (break ties randomly)
  candidates.sort((a, b) => b.tier - a.tier || Math.random() - 0.5);
  const { item, tier } = candidates[0];
  const cg = clientGender();
  const name = `${pick(NAMES[cg])} ${pick(SURNAMES)}`;
  // Tier 3 = familiar, pays better, slightly easier; Tier 2 = pleased but new
  const payMult = tier >= 3 ? 1.4 : 1.2;
  const dcMod = tier >= 3 ? -2 : -1;
  const blurbs = tier >= 3
    ? [`"I've been thinking about you since last time," ${cg === "male" ? "he" : "she"} says.`,
       `The look ${cg === "male" ? "he" : "she"} gives you says this isn't the first time.`,
       `"Ask for you by name," ${cg === "male" ? "he" : "she"} says. "Told me you were worth it."`]

       `"Word gets around. I wanted to find out for myself."`,

function grossPay(item, patron) {

  if (state.character.appearance === "plain") pay = Math.max(4, pay - 2);
  if (state.classFeatures.allure) pay += 2;
  if (state.upgrades.clothes) pay += 2;
  if (state.upgrades.jewelry) pay += 1;
  if (state.classFeatures.scar) pay -= 1;
  if (state.classFeatures.tattoo && tier <= 1) pay *= 1.15;
  if (state.classFeatures.bargainer) pay *= 1.1;
  pay *= 1 + state.rank * 0.08;
  pay *= 1 + clamp(state.reputation, 0, 200) / 400;
  if (state.character.motivation === "debt") pay *= 1.1;
  pay = Math.round(pay * (state.phaseMods.payMult || 1));

const TABS = [
  { id: "work", ico: "✧", label: "City" },
  { id: "self", ico: "✦", label: "Self" },
  { id: "guild", ico: "⚜", label: "Guild" },
  { id: "market", ico: "⚖", label: "Market" },
  { id: "journal", ico: "✎", label: "Journal" }
];
const TRACKED = [
  ["coin", "coin", true], ["standing", "standing", true], ["reputation", "rep", true], ["fame", "fame", true],
  ["energy", "energy", true], ["health", "health", true], ["stress", "stress", false],
  ["control", "control", true], ["trauma", "trauma", false], ["debt", "debt", false]
];

const UI = {
  tab: "work",
  locked: false,
  tabsLocked: true,

  renderHUD() {
    const fame = getFameTier(state.fame);
    const started = !!state.character.name && Game.mode !== "creation";
    const meter = (label, val, color) =>
      `<div class="m"><div class="row"><span>${label}</span><span>${val}</span></div><div class="track"><div class="fill" style="width:${clamp(val, 0, 100)}%;background:${color}"></div></div></div>`;
    $("hud").innerHTML = `
      <div class="hud-top">
        <div class="brand">${state.character.name ? esc(state.character.name) : "Medieval Courtesan"}</div>
        <div class="when">${started ? city().name + " · " : ""}Day ${state.day} · ${cap(state.phase)}</div>
      </div>
      <div class="purse">
        ${started ? `<span style="color:var(--gold)">${rankName()}${state.ironman ? " · Ironman" : ""}</span>` : ""}
        <span><b style="color:var(--c-coin)">${state.coin}</b> coin</span>
        ${state.debt ? `<span><b style="color:var(--bad)">${state.debt}</b> debt</span>` : ""}
        ${started ? `<span><b style="color:${state.standing < RANKS[state.rank].standing ? "var(--bad)" : "var(--c-xp)"}">${state.standing}</b> standing</span>` : ""}
        <span><b style="color:var(--c-rep)">${state.reputation}</b> rep</span>
        <span style="color:var(--c-fame)" title="Fame: ${state.fame}">${fame.name}${state.fame >= 100 ? " · Notorious" : state.fame >= 20 ? " · Recognised" : " · Discreet"}</span>
        <span>Lv <b style="color:var(--c-xp)">${state.level}</b></span>
        ${state.trauma ? `<span title="Trauma: at 100 you burn out">Trauma <b style="color:${state.trauma >= 60 ? "var(--bad)" : "var(--c-trauma)"}">${state.trauma}</b></span>` : ""}
        ${state.inspiration ? `<span style="color:var(--gold)">✧ Inspired</span>` : ""}
      </div>
      <div class="meters">
        ${meter("Energy", state.energy, "var(--c-energy)")}
        ${meter("Health", state.health, "var(--c-health)")}
        ${meter(state.stress >= 80 ? "Stress — fraying" : state.stress >= 50 ? "Stress — tense" : "Stress", state.stress, "var(--c-stress)")}
        ${meter("Control", state.control, "var(--c-control)")}
        ${state.trauma ? meter("Trauma" + (state.trauma >= 60 ? " — critical" : state.trauma >= 30 ? " — building" : ""), state.trauma, "var(--c-trauma)") : ""}
      </div>
      <div class="deltas" id="deltas"></div>`;
  },

  snap() { const o = {}; TRACKED.forEach(([k]) => { o[k] = state[k]; }); return o; },
  showDeltas(before) {
    const box = $("deltas");
    if (!box) return;
    box.innerHTML = "";
    TRACKED.forEach(([k, label, upGood]) => {
      const d = (state[k] || 0) - (before[k] || 0);
      if (!d) return;
      const good = upGood ? d > 0 : d < 0;
      const el = document.createElement("span");
      el.className = "delta " + (good ? "good" : "bad");
      el.textContent = `${sign(d)} ${label}`;
      box.appendChild(el);
    });
  },

  renderTabs() {
    $("tabs").innerHTML = "";
    TABS.forEach(t => {
      const alert = (t.id === "self" && state.pendingLevelUps > 0) || (t.id === "guild" && Game.mode !== "creation" && trialReady());
      const b = document.createElement("button");
      b.className = "tab" + (UI.tab === t.id ? " on" : "") + (alert ? " alert" : "");
      b.innerHTML = `<span class="ico">${t.ico}</span>${t.label}<span class="dot"></span>`;
      b.disabled = UI.tabsLocked && t.id !== "work";
      b.onclick = () => { if (!b.disabled) UI.showTab(t.id); };
      $("tabs").appendChild(b);
    });
  },

  setTabsLocked(v) { this.tabsLocked = v; this.renderTabs(); },

  showTab(id) {
    UI.tab = id;
    const work = id === "work";
    $("work").hidden = !work;
    $("view").hidden = work;
    UI.renderTabs();
    window.scrollTo(0, 0);
    if (work) Game.menu();
    else UI.renderView();
  },

  scene(o) {
    const chips = (o.chips || []).map(c => `<span class="chip ${c.cls || ""}">${c.text}</span>`).join("");
    let meter = "";
    if (o.meter) {
      meter = `<div class="bigmeter"><div class="lbl"><span>${o.meter.label}</span><span>${o.meter.value}%</span></div>
        <div class="track"><div class="fill" style="width:${clamp(o.meter.value, 0, 100)}%;background:${o.meter.color || "var(--gold)"}"></div></div>
        ${o.meter.pips ? `<div class="pips">${Array.from({ length: o.meter.pips.max }, (_, i) => `<span class="pip ${i < o.meter.pips.used ? "on" : ""}"></span>`).join("")}</div>` : ""}</div>`;
    }
    let roll = "";
    if (o.roll) {
      const r = o.roll;
      const dice = r.raw.length > 1
        ? `<div class="die">${r.roll}</div><div class="die ghost">${r.raw[0] === r.roll ? r.raw[1] : r.raw[0]}</div>`
        : `<div class="die">${r.roll}</div>`;
      roll = `<div class="roll ${r.success ? "ok" : "no"}">${dice}<div><div class="res">${r.label} — ${r.success ? "Success" : "Failure"}</div>
        <div class="math">${r.roll} ${sign(r.bonus)} = ${r.total} vs ${r.dc}${r.type ? " · " + r.type : ""}</div></div></div>`;
    }
    $("scene").innerHTML = `${o.kicker ? `<div class="kicker">${o.kicker}</div>` : ""}<h2>${o.title}</h2>
      ${o.speech ? `<div class="speech">${o.speech}</div>` : ""}<div class="body">${o.body || ""}</div>${o.html || ""}${meter}${roll}${chips ? `<div class="chips">${chips}</div>` : ""}`;
  },

  makeButton(c) {
    const b = document.createElement("button");
    b.className = "btn" + (c.primary ? " primary" : "") + (c.danger ? " danger" : "") + (c.quiet ? " quiet" : "") + (c.kind ? " btn-" + c.kind : "");
    let badge = "";
    if (typeof c.odds === "number") {
      const pct = Math.round(c.odds * 100);
      badge = `<span class="odds ${pct >= 70 ? "hi" : pct >= 40 ? "md" : "lo"}">${pct}%</span>`;
    } else if (c.price) badge = `<span class="price">${c.price}</span>`;
    const hint = c.disabled && c.reason ? c.reason : c.hint;
    b.innerHTML = `<span class="txt"><span class="lbl">${c.label}</span>${hint ? `<span class="hint">${hint}</span>` : ""}</span>${badge}`;
    b.disabled = !!c.disabled;
    b.onclick = () => {
      if (UI.locked || b.disabled) return;
      UI.locked = true;
      document.querySelectorAll(".btn").forEach(x => { x.disabled = true; });
      const before = UI.snap();
      c.action();
      UI.renderHUD();
      if (UI.skipDeltas) UI.skipDeltas = false;
      else UI.showDeltas(before);
    };
    return b;
  },

  // Render a list of choices. Items may be { section: "Title" } or { grid: [choices] }.
  choices(list, container) {
    const el = container || $("choices");
    el.innerHTML = "";
    list.forEach(c => {
      if (!c) return;
      if (c.section) { const s = document.createElement("div"); s.className = "sect"; s.textContent = c.section; el.appendChild(s); return; }
      if (c.grid) {
        const g = document.createElement("div"); g.className = "grid2";
        c.grid.forEach(x => g.appendChild(UI.makeButton(x)));
        el.appendChild(g); return;
      }
      el.appendChild(UI.makeButton(c));
    });
    setTimeout(() => { UI.locked = false; }, 160);
  },

  toast(text) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  },

  /* ---------- Tab views ---------- */
  renderView() {
    UI.renderHUD();
    UI.renderTabs();
    const v = $("view");
    v.innerHTML = "";
    if (UI.tab === "self") UI.viewSelf(v);
    else if (UI.tab === "guild") UI.viewGuild(v);
    else if (UI.tab === "market") UI.viewMarket(v);
    else if (UI.tab === "journal") UI.viewJournal(v);
    setTimeout(() => { UI.locked = false; }, 160);
  },

  panel(v, title, sub, html) {
    const p = document.createElement("div");
    p.className = "panel";
    p.innerHTML = `<h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ""}${html || ""}`;
    v.appendChild(p);
    return p;
  },
  addChoices(panel, list) {
    const c = document.createElement("div");
    c.className = "choices";
    panel.appendChild(c);
    UI.choices(list, c);
  },
  bar(label, val, max, color, shown) {
    return `<div class="bar-row"><span>${label}</span><div class="track"><div class="fill" style="width:${clamp(val / max * 100, 0, 100)}%;background:${color}"></div></div><span class="v">${shown !== undefined ? shown : val}</span></div>`;
  },
  req(ok, label, val) { return `<div class="req"><span class="${ok ? "ok" : "no"}">${ok ? "✓" : "○"}</span><span>${label}</span><span class="v">${val}</span></div>`; },

  viewSelf(v) {
    const c = state.character;
    const fame = getFameTier(state.fame);
    const portraitHtml = c.portrait
      ? `<img class="portrait-img" src="${c.portrait}" alt="portrait" onclick="handlePortraitUpload('player',null)" title="Tap to change portrait" />`
      : `<div class="portrait-placeholder" onclick="handlePortraitUpload('player',null)" title="Upload a portrait">No portrait<br><small>tap to add</small></div>`;
    const descLine = `${rankName()} of the Guild · ${classLabel(c.class)}${c.subclass ? " · " + c.subclass : ""} · ${cap(c.appearance)} ${buildWord(c.build).toLowerCase()} ${pr("noun")} · ${c.background || "no background"}`;
    const p = UI.panel(v, `${esc(c.name || "Nameless")}`, "",
      `<div class="portrait-wrap">${portraitHtml}<div class="portrait-meta"><div style="font-size:.85rem;color:var(--mute);margin-bottom:6px">${descLine}</div>` +
      UI.bar("Level " + state.level, state.xp, state.xpToNext, "var(--c-xp)", `${state.xp}/${state.xpToNext}`) +
      `<div class="kv" style="margin-top:8px">
        <span>Proficiency</span><span>+${state.proficiencyBonus}</span>
        <span>Fame</span><span>${fame.name} · ${state.fame >= 100 ? "Notorious" : state.fame >= 50 ? "Recognised" : state.fame >= 20 ? "Whispered" : "Discreet"} (${state.fame})</span>
        <span>Reputation</span><span>${state.reputation}</span>
        <span>Inspiration</span><span>${state.inspiration ? "Ready" : "—"}</span>
        <span>Exhaustion</span><span style="color:${state.exhaustion ? "var(--bad)" : "inherit"}">${state.exhaustion}</span>
        <span>Trauma</span><span style="color:var(--c-trauma)">${state.trauma}/100</span>
      </div></div></div>`);
    if (state.pendingLevelUps > 0) {
      UI.addChoices(p, [{ label: "Choose your attribute increase", hint: `${state.pendingLevelUps} waiting`, primary: true, action: () => UI.showTab("work") }]);
    }

    UI.panel(v, "Attributes", "", `<div class="attrs">${Object.keys(state.attributes).map(a => {
      const m = getMod(state.attributes[a]);
      return `<div class="attr" title="${ATTR_USE[a]}"><div class="k">${a.toUpperCase()}</div><div class="v">${state.attributes[a]}</div><div class="mod">${sign(m)}</div></div>`;
    }).join("")}</div>`);

    UI.panel(v, "Skills", "Bonus includes attribute, proficiency (at 20+), training and exhaustion. Wit in courtship uses INT.",
      Object.keys(state.skills).map(k => UI.bar(SKILL_LABEL[k], state.skills[k], 100, state.skills[k] >= 20 ? "var(--gold)" : "var(--line2)", sign(getSkillBonus(k)))).join(""));

    const preferred = [...(CLASS_POSITIONS[c.class] || []), ...(SUBCLASS_POSITIONS[c.subclass] || [])];
    const techChip = (id, extra) => {
      const t = masteryTier(id);
      const it = anyItem(id);
      const hasDesc = !!TECH_DESC[id];
      return `<span class="chip ${preferred.includes(id) ? "gold" : ""}${hasDesc ? " chip-tap" : ""}" ${hasDesc ? `onclick="(function(el){var d=el.nextElementSibling;if(d&&d.classList.contains('tech-detail')){d.remove();el.classList.remove('chip-open');}else{var n=document.createElement('div');n.className='tech-detail';n.innerHTML='<p>${(TECH_DESC[id]||"").replace(/'/g,"&#39;")}</p>';el.insertAdjacentElement('afterend',n);el.classList.add('chip-open');}el.parentElement&&el.parentElement.style&&(el.parentElement.style.flexWrap='wrap');})(this)"` : ""}>${preferred.includes(id) ? "★ " : ""}${it.name}${t ? ` · ${MASTERY_NAMES[t]}` : ""}${hasDesc ? " ▾" : ""}${extra || ""}</span>`;
    };
    const locked = INDEX.positions.filter(p => !state.knownPositions.includes(p.id));
    UI.panel(v, "Techniques", "Using a technique trains its skill and builds mastery: Practiced (+1), Expert (+2), Master (+3). Class techniques (★) hit harder. Tap any known technique to see what it involves.",
      `<div class="sub" style="margin:0 0 4px">Positions</div><div class="chips" style="margin-top:0;flex-wrap:wrap">${state.knownPositions.filter(isPosition).map(id => techChip(id)).join("")}</div>
       <div class="sub" style="margin:10px 0 4px">Kinks you know</div><div class="chips" style="margin-top:0;flex-wrap:wrap">${knownKinks().length ? knownKinks().map(id => techChip(id)).join("") : `<span class="empty">None yet — succeed at a client's request to learn one.</span>`}</div>
       ${locked.length ? `<div class="sub" style="margin:10px 0 4px">Still to learn</div><div class="chips" style="margin-top:0">${locked.map(p => `<span class="chip">${p.name} · ${p.req ? `${SKILL_LABEL[p.skill]} ${state.skills[p.skill]}/${p.req}` : "from a client or level-up"}</span>`).join("")}</div>` : ""}`);

    const specs = (c.specialties || []).map(nameOf), lims = (c.limits || []).map(nameOf);
    UI.panel(v, "Desires & details", "",
      `<div class="kv">
        <span>Specialties</span><span>${specs.length ? specs.join(", ") : "—"}</span>
        <span>Limits</span><span>${lims.length ? lims.join(", ") : "—"}</span>
        <span>Clientele</span><span>${(CLIENTELE[c.clientele] || CLIENTELE.anyone).label}</span>
        <span>Hair · eyes</span><span>${c.hair || "—"} · ${c.eyes || "—"}</span>
        ${bodyParts(c.gender).map(k => `<span>${BODY[k].label}</span><span>${(c.body || BODY_DEFAULT)[k] || BODY_DEFAULT[k]}</span>`).join("")}
        <span>Mark · voice</span><span>${(MARKS[c.mark] || MARKS.none).label} · ${(VOICES[c.voice] || { label: "—" }).label}</span>
      </div>`);

    const featList = (state.feats || []).map(k => FEATS[k] ? `<div class="feat"><b>${FEATS[k].name}</b> <span>— ${FEATS[k].desc}</span></div>` : "").join("");
    const fp = UI.panel(v, "Feats", "A new feat at levels 4, 8 and 12.", featList || `<div class="empty">No feats yet.</div>`);
    if (state.pendingFeats > 0) UI.addChoices(fp, [{ label: "Choose your new feat", primary: true, action: () => UI.showTab("work") }]);

    const traitIds = c.traits || [];
    const traitText = traitIds.map(id => { const t = (typeof TRAITS !== "undefined") && (TRAITS.pos.find(x => x.id === id) || TRAITS.neg.find(x => x.id === id)); return t ? `<div class="feat"><b>${t.name}</b> <span>— ${t.desc}</span></div>` : ""; }).join("");
    const other = Object.keys(state.classFeatures).filter(k => state.classFeatures[k] && FEATURE_INFO[k] && !(state.feats || []).includes(k)).map(k => `<div class="feat"><b>${FEATURE_INFO[k][0]}</b> <span>— ${FEATURE_INFO[k][1]}</span></div>`).join("");
    UI.panel(v, "Traits & features", "", (traitText + other) || `<div class="empty">None.</div>`);
  },

  viewGuild(v) {
    // Rank
    const n = nextRank();
    const floor = state.rank > 0 ? demoteFloor(state.rank) : EXPEL_AT;
    const rp = UI.panel(v, rankName(), state.rank > 0
      ? `Rank ${state.rank + 1} of ${RANKS.length} · demoted if Standing falls below ${floor}`
      : `Rank 1 of ${RANKS.length} · expelled from the guild if Standing falls below ${EXPEL_AT}`,
      UI.bar("Standing", Math.max(0, state.standing - (state.rank ? RANKS[state.rank].standing : 0)), n ? n.standing - (state.rank ? RANKS[state.rank].standing : 0) : 1, state.standing < RANKS[state.rank].standing ? "var(--bad)" : "var(--c-xp)", state.standing) +
      (n ? `<div class="sub" style="margin:10px 0 4px">To become ${an(n.name)} ${n.name} — ${n.trial === "final" ? "the final trial before the Guild Council" : n.trial === "court" ? "a courtship trial" : "an encounter trial"}:</div>` +
        trialReqs().map(r => UI.req(r.ok, r.label, r.val)).join("") +
        `<div class="sub" style="margin:8px 0 0">Promotion grants ${n.purse ? n.purse + " coin and " : ""}an attribute increase.</div>` : `<div class="body">You have reached the summit of the guild.</div>`));
    if (n) UI.addChoices(rp, [{ label: n.trial === "final" ? "Face the Guild Council" : `Face the trial for ${n.name}`, primary: true,
      disabled: !trialReady() || state.flags.trialDay === state.day, reason: !trialReady() ? "Meet every requirement first" : "You've already faced a trial today",
      action: () => { UI.showTab("work"); Game.startTrial(); } }]);

    const mot = MOTIVES[state.character.motivation];
    if (mot) UI.panel(v, "Your reason", mot.label, `<div class="body">${mot.goal}</div><div class="sub" style="margin:6px 0 0">${mot.progress()}</div>`);

    // Contracts
    const cs = state.contracts.active;
    const cp = UI.panel(v, "Contracts", `${cs.length} of ${maxContracts()} taken · ${state.contracts.done} fulfilled, ${state.contracts.failed} broken. A broken contract costs standing.`,
      cs.length ? cs.map(k => `<div class="staff"><div class="top"><span>${k.title}</span><span style="color:var(--mute);font-size:.8rem">${k.kind === "tally" ? "anywhere" : city(k.city).name} · ${daysLeft(k)}</span></div><div class="sub" style="margin:2px 0 0">${k.short}${k.kind === "tally" ? ` · ${k.have}/${k.need}` : ""}</div></div>`).join("") : `<div class="empty">No contracts. Check the board at any guildhouse.</div>`);
    UI.addChoices(cp, [{ label: "Read the contract board", action: () => { UI.showTab("work"); Game.board(); } }]);

    // Quests
    const qs = QUESTS.filter(q => state.quests[q.id]);
    UI.panel(v, "Quests", "Find new ones by asking around a city's guildhouse.",
      qs.length ? qs.map(q => {
        const s = state.quests[q.id];
        const status = s.status === "done" ? "✓ Done" : s.status === "failed" ? "✕ Failed" : `${city(q.city).name} · ${q.steps[s.step].desc}`;
        return `<div class="staff"><div class="top"><span>${q.title}</span><span style="color:var(--mute);font-size:.8rem">${status}</span></div></div>`;
      }).join("") : `<div class="empty">No quests yet.</div>`);

    // Travel
    const tp = UI.panel(v, "Travel", "Each journey takes the rest of the day. Higher cities pay more and expect more.");
    UI.addChoices(tp, CITIES.map(c => {
      const here = c.id === state.city;
      const locked = state.rank < c.rank;
      const cost = travelCost(c.id);
      return {
        label: `${here ? "✓ " : ""}${c.name}`,
        hint: here ? `You are here · ${c.kind}` : locked ? `${c.kind} · requires ${rankName(c.rank)}` : `${c.kind} · ${cost} coin · arrive tomorrow morning`,
        price: here || locked ? "" : String(cost),
        disabled: here || locked || state.coin < cost,
        reason: here ? `You are here · ${c.kind}` : locked ? `${c.kind} · requires ${rankName(c.rank)}` : `${c.kind} · need ${cost} coin`,
        action: () => { UI.showTab("work"); Game.travel(c.id); }
      };
    }));

    // Money
    const money = UI.panel(v, "Money", "",
      `<div class="kv">
        <span>Coin</span><span style="color:var(--c-coin)">${state.coin}</span>
        <span>Debt</span><span style="color:${state.debt ? "var(--bad)" : "inherit"}">${state.debt}${state.debt ? ` · ${Math.max(0, state.debtDays)}d overdue` : ""}</span>
        ${state.debt ? `<span>Interest</span><span>5% daily</span>` : ""}
        <span>Lodging in ${city().name}</span><span>${lodging()}/day</span>
        <span>Guild dues</span><span>${Game.dues()} every 7th day (next: day ${Math.ceil((state.day + 1) / 7) * 7})</span>
      </div>`);
    if (state.debt) UI.addChoices(money, [{ label: "Pay down debt", hint: `Pay up to ${Math.min(state.coin, state.debt)}`, disabled: state.coin < 1, reason: "No coin", action: () => Game.payDebt() }]);

    const rels = NPCS.filter(x => state.relationships[x.id]);
    UI.panel(v, "People", "Regulars remember you. Some of them want more than an hour.",
      rels.length ? rels.map(x => {
        const r = rel(x.id);
        const npcSrc = npcPortraitSrc(x.id);
        const npcThumb = npcSrc
          ? `<img class="npc-portrait" src="${npcSrc}" alt="${x.name}" onclick="handlePortraitUpload('npc','${x.id}')" title="Change portrait" />`
          : `<div class="npc-portrait-placeholder" onclick="handlePortraitUpload('npc','${x.id}')" title="Add portrait">${NPC_EMOJI[x.id] || "👤"}</div>`;
        return `<div class="staff"><div class="staff-inner">${npcThumb}<div class="staff-body"><div class="top"><span>${x.name}</span><span style="color:var(--mute);font-size:.8rem">${x.blurb}</span></div>
          ${UI.bar("Affection", r.love, 20, "var(--c-rep)")}${UI.bar("Trust", r.trust, 15, "var(--c-control)")}</div></div></div>`;
      }).join("") : `<div class="empty">No one has made an impression yet.</div>`);
  },

  viewMarket(v) {
    const p = UI.panel(v, `The market in ${city().name}`, "Spend coin to work better, earn more, or recover faster.");
    UI.addChoices(p, MARKET.map(i => {
      const owned = i.once && state.upgrades[i.id];
      return {
        label: i.name + (owned ? " ✓" : ""),
        hint: owned ? "Owned" : i.desc,
        price: owned ? "" : String(priceOf(i)),
        disabled: owned || state.coin < priceOf(i),
        reason: owned ? "Owned" : `Need ${priceOf(i)} coin`,
        action: () => Game.buy(i)
      };
    }));
  },

  viewJournal(v) {
    const s = state.stats;
    const types = Object.keys(s.byType).filter(k => s.byType[k] > 0).map(k => `<span>${SKILL_LABEL[k] || k}</span><span>${s.byType[k]}</span>`).join("");
    UI.panel(v, "Ledger", "",
      `<div class="kv">
        <span>Days</span><span>${s.daysPlayed}</span>
        <span>Cities visited</span><span>${Object.keys(state.visited || {}).length} of ${CITIES.length}</span>
        <span>Clients served</span><span>${s.bodyCount}</span>
        <span>Satisfied / unsatisfied</span><span>${s.successes} / ${s.failures}</span>
        <span>Group encounters</span><span>${s.groups || 0}</span>
        <span>Courtships won</span><span>${s.courtWins} of ${s.courtships}</span>
        <span>Quests completed</span><span>${s.questsDone}</span>
        <span>Demotions</span><span>${s.demotions}</span>
        <span>Trouble survived</span><span>${s.troubles}</span>
        <span>Coin earned</span><span>${s.coinEarned}</span>
        ${types}
      </div>`);
    const np = UI.panel(v, "Settings", "");
    const full = (state.settings || {}).narration !== "brief";
    UI.addChoices(np, [{ label: `Encounter narration: ${full ? "Full" : "Brief"}`, hint: full ? "Descriptive lines every turn · tap for short mechanical text" : "Short mechanical text · tap for descriptive lines", disabled: !Narrator.data(), reason: "narration.js not found", action: () => { state.settings = { ...(state.settings || {}), narration: full ? "brief" : "full" }; UI.renderView(); } }]);
    const p = UI.panel(v, "Save", state.ironman ? "Ironman: the game saves itself constantly, and you can't reload. If you're expelled or burn out, the save is gone." : "The game also saves itself at every dawn.");
    UI.addChoices(p, [
      { label: "Save game", disabled: state.ironman, reason: "Ironman saves automatically", action: () => Game.save(true) },
      { label: "Load game", disabled: state.ironman || !Game.hasSave(), reason: state.ironman ? "No reloading in Ironman" : "No save yet", action: () => Game.load() },
      { label: Game.confirmNew ? "Tap again to abandon this life" : "Start a new life", danger: true, action: () => { if (Game.confirmNew) { Game.confirmNew = false; Game.newGame(); } else { Game.confirmNew = true; UI.renderView(); setTimeout(() => { Game.confirmNew = false; }, 4000); } } }
    ]);
    UI.panel(v, "Journal", "Most recent first.",
      state.journal.length ? state.journal.map(e => `<div class="entry ${e.k === "roll" ? "roll-entry" : ""}"><div class="when">Day ${e.d} · ${e.p}</div>${e.t}</div>`).join("") : `<div class="empty">Nothing written yet.</div>`);
  }
};

/* Body preferences: what a client or noble finds irresistible about a companion. */
function rollBodyPref() {
  const r = Math.random();
  if (r < 0.2) return null;
  if (r < 0.32) return { kind: "build", value: pick(Object.keys(BUILDS)) };
  if (r < 0.42) return { kind: "hair", value: pick(HAIR) };
  if (r < 0.48) return { kind: "looks", value: "striking" };
  // a taste for one body part; your most extreme features draw the most attention
  const g = state.character.gender, body = { ...BODY_DEFAULT, ...(state.character.body || {}) };
  const parts = bodyParts(g);
  const w = parts.map(k => { const o = BODY[k].opts, i = o.indexOf(body[k]); return BODY[k].flat ? 1 : (i === 0 || i === o.length - 1) ? 2.5 : 1; });
  let x = Math.random() * w.reduce((a, b) => a + b, 0), part = parts[0];
  for (let i = 0; i < parts.length; i++) { x -= w[i]; if (x <= 0) { part = parts[i]; break; } }
  if (BODY[part].flat) return { kind: "part", part, dir: pick(BODY[part].opts) };
  return { kind: "part", part, dir: Math.random() < 0.6 ? "big" : "small" };
}
function bodyPrefText(bp, cg) {
  if (!bp) return "";
  if (bp.kind === "part") return BODY_TASTE[bp.part][bp.dir];
  if (bp.kind === "build") return `has a weakness for ${buildWord(bp.value).toLowerCase()} figures`;
  if (bp.kind === "hair") return `is partial to ${bp.value.toLowerCase()} hair`;
  return "only wants the most striking companions";
}
function bodyMatch(bp) {
  if (!bp) return 0;
  const c = state.character;
  if (bp.kind === "part") {
    const B = BODY[bp.part];
    if (B.g && B.g !== c.gender) return 0;
    const v = (c.body || BODY_DEFAULT)[bp.part] || BODY_DEFAULT[bp.part], i = B.opts.indexOf(v), n = B.opts.length;
    if (B.flat) return v === bp.dir ? 1 : 0;
    if (bp.dir === "big") return i >= n - 2 ? 1 : i === 0 ? -1 : 0;
    return i <= 1 ? 1 : i === n - 1 ? -1 : 0;
  }
  const yes = bp.kind === "build" ? c.build === bp.value : bp.kind === "hair" ? c.hair === bp.value : c.appearance === "striking";
  return yes ? 1 : bp.kind === "looks" ? -1 : 0;
}
function garments(cg) { return cg === "male" ? { garment: "shirt", lower: "breeches", lace: "doublet laces" } : { garment: "gown", lower: "skirts", lace: "bodice laces" }; }
const NPC_GENDER = { marlow: "male", edric: "male", briar: "female" };

function handlePortraitUpload(kind, id, afterCb) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 4 * 1024 * 1024) { alert("Image too large — keep it under 4 MB."); return; }
    const rd = new FileReader();
    rd.onload = ev => {
      const src = ev.target.result;
      // downscale large images via canvas to keep save size manageable
      const img = new Image();
      img.onload = () => {
        const MAX = 300;

      const f = FEATS[k], met = featReqMet(state, f), req = featReqText(f);
      return { label: f.name, hint: f.desc + (req ? ` · requires ${req}` : ""), disabled: !met, reason: `${f.desc} · requires ${req}`, action: () => {
        state.feats = [...(state.feats || []), k];
        state.classFeatures[k] = true;
        state.pendingFeats = Math.max(0, (state.pendingFeats || 0) - 1);
        this.log(`Learned the feat ${f.name}.`);
        this.menu();
      } };
    }).concat(avail.some(k => featReqMet(state, FEATS[k])) ? [] : [{ label: "Nothing fits yet", hint: "Raise your attributes or skills; this feat choice is saved for later", quiet: true, action: () => { state.pendingFeats = 0; state.savedFeats = (state.savedFeats || 0) + 1; this.menu(); } }]));
  },

  offerLevelUp() {
    this.setMode("event");
    UI.scene({ kicker: "Improvement", title: "An attribute improves", body: `Choose an attribute to raise by one.${state.pendingLevelUps ? `\n<em>${state.pendingLevelUps} more after this.</em>` : ""}` });
    UI.choices(["str", "dex", "con", "int", "wis", "cha"].map(a => ({
      label: `${a.toUpperCase()} ${state.attributes[a]} → ${Math.min(20, state.attributes[a] + 1)}`,
      hint: ATTR_USE[a],
      disabled: state.attributes[a] >= 20, reason: "Maxed",
      action: () => {
        state.attributes[a] = Math.min(20, state.attributes[a] + 1);
        this.log(`${a.toUpperCase()} rose to ${state.attributes[a]}.`);
        this.menu();
      }
    })));
  },

  /* ---------- Encounters ---------- */
  // spec (optional): { name, cg, blurb, typeKey, item, dcMod, payMult, patron, trial, noTrouble }
  startEncounter(spec) {
    if (!spec) {
      const why = whyCantWork();
      if (why) { UI.toast(why); this.menu(); return; }
      state.flags.clientsThisPhase++;
    } else if (state.energy < 15 || state.health < MIN_HEALTH_TO_WORK) {
      UI.toast("Too tired or hurt. Rest first."); this.hook = null; this.menu(); return;
    }
    this.setMode("encounter");
    const c = city();
    const limits = state.character.limits || [];
    const specs = (state.character.specialties || []).map(anyItem).filter(Boolean);
    const groupOdds = 0.07 + 0.03 * c.tier + (state.classFeatures.crowdPleaser || state.classFeatures.ringmaster ? 0.05 : 0);
    const group = spec ? !!spec.group : Math.random() < groupOdds;
    const n = group ? (spec && spec.group ? spec.group : Math.random() < 0.75 ? 2 : 3) : 1;
    const makePrefs = () => {
      const all = [...INDEX.positions, ...INDEX.kinks].map(x => x.id).sort(() => Math.random() - 0.5);
      const likes = [Math.random() < 0.6 ? pick(c.tastes) : all[0]];
      likes.push(all.find(id => !likes.includes(id)));
      return { likes, dislikes: all.filter(id => !likes.includes(id)).slice(0, 2) };
    };
    const prefs = makePrefs();
    prefs.body = rollBodyPref();

    let item;
    if (spec && spec.item) item = anyItem(spec.item);
    else {
      const useKink = Math.random() > 0.5;
      let pool = useKink ? INDEX.kinks : INDEX.positions.filter(p => knows(p.id));
      if (state.level < 3) pool = pool.filter(x => x.risk <= 2);
      if (!pool.length) pool = [INDEX.positions[0]];
      item = pick(pool);
      const liked = pool.find(x => prefs.likes.includes(x.id) && !limits.includes(x.id));
      if (liked && Math.random() < 0.5) item = liked;
      if (useKink && specs.length && Math.random() < 0.35) item = pick(specs);
      if (!useKink && Math.random() < 0.15) {
        const fresh = INDEX.positions.filter(p => !knows(p.id) && canLearn(p.id));
        if (fresh.length) item = pick(fresh);
      }
      if (limits.includes(item.id) && Math.random() < 0.5) {
        const alt = pool.filter(x => !limits.includes(x.id));
        if (alt.length) item = pick(alt);
      }
    }
    prefs.dislikes = prefs.dislikes.filter(id => id !== item.id);

    const fameIdx = getFameIndex();
    const patron = spec ? !!spec.patron : !group && fameIdx >= 2 && Math.random() < 0.1 + 0.03 * (fameIdx - 2);
    let type = spec && spec.typeKey ? CLIENT_TYPES[spec.typeKey] : rollClientType();
    if (patron && !(spec && spec.typeKey)) type = Math.random() < 0.5 ? CLIENT_TYPES.generous : CLIENT_TYPES.demanding;
    let npc = null;
    if (spec && spec.name) npc = { id: null, name: spec.name, blurb: spec.blurb || "" };
    else if (!spec && !group && !patron && c.npcs.length) {
      const want = pick(c.npcs);
      const cand = NPCS.find(x => x.id === want);
      if (cand) {
      const fit = CLIENTELE[state.character.clientele || "anyone"].male;
      const w = NPC_GENDER[cand.id] === "male" ? fit : 1 - fit;
      if (Math.random() < 0.3 * Math.min(1, w * 2)) npc = cand;
    } }
    const COUPLE_TYPES = [
      { rel: "newlyweds", blurb: "Married three weeks ago. This is their honeymoon treat." },
      { rel: "lovers", blurb: "They've been together long enough to know exactly what they want from a night like this." },
      { rel: "a long-term couple", blurb: "Comfortable enough with each other that embarrassment isn't part of tonight." },
      { rel: "two old friends who finally crossed a line", blurb: "Something shifted between them recently. They're still figuring out what it means." },
      { rel: "a merchant and her favorite clerk", blurb: "The arrangement is open enough that this counts as a gift for both of them." },
      { rel: "a pair of officers on their last night before deployment", blurb: "One of them talked the other into this. Neither of them minds." },
      { rel: "an artist and their muse", blurb: "They've spent months studying each other. Tonight they're spending it differently." },
      { rel: "nobles who've been discreet about this for years", blurb: "The discretion is habit now. They don't need it here." }
    ];
    let party = null;
    let coupleData = null;
    if (group) {
      party = [];
      // 35% of size-2 groups are a pre-formed couple
      const isCouple = n === 2 && !spec && Math.random() < 0.35;
      if (isCouple) coupleData = pick(COUPLE_TYPES);
      for (let i = 0; i < n; i++) {
        // couples can be same-sex; use shared gender roll for visual coherence ~40% of time
        const cg = (isCouple && i === 1 && Math.random() < 0.4) ? party[0].cg : clientGender();
        let nm = pick(NAMES[cg]);
        while (party.some(m => m.name === nm)) nm = pick(NAMES[cg]);
        const mp = makePrefs(); mp.body = rollBodyPref();
        // couples share a like — the thing they came for together
        if (isCouple && i === 1) mp.likes[0] = party[0].prefs.likes[0];
        party.push({ name: nm, cg, prefs: mp });
      }
      party.forEach(m => { m.prefs.dislikes = m.prefs.dislikes.filter(id => id !== item.id); });
    }

    let dc = 8 + item.risk * 2 + c.tier + Math.floor(Math.random() * 3) + ((spec && spec.dcMod) || 0);
    if (group) dc += 1 + (state.classFeatures.shyCrowds ? 2 : 0);
    if (!group && prefs.likes.includes(item.id)) dc -= 1;
    if (!group && prefs.dislikes.includes(item.id)) dc += 2;
    const bm = group ? 0 : bodyMatch(prefs.body);
    dc -= bm;

    let gross = Math.round(grossPay(item, patron) * (spec && spec.payMult !== undefined ? spec.payMult : 1));
    if (group) gross = Math.round(gross * 0.85 * n);
    if (specs.some(x => x.id === item.id)) gross = Math.round(gross * 1.15);
    if (bm > 0) gross = Math.round(gross * 1.1);
    if (bm < 0) gross = Math.round(gross * 0.9);
    if (state.classFeatures.ropeMaster && (item.id === "bondage" || item.id === "dominance_and_submission")) gross = Math.round(gross * 1.2);

    this.offer = {
      item, prefs, type, patron, npc, party, couple: coupleData, spec: spec || null, tier: c.tier,
      stranger: pick(c.strangers),
      cg: spec && spec.cg ? spec.cg : npc && npc.id ? NPC_GENDER[npc.id] : clientGender(),
      baseDC: dc, gross,
      stress: (c.tier <= 1 ? 5 : 3) + (group ? 2 * (n - 1) : 0),
      revealed: false, readTried: false
    };
    this.log(`${this.whoOf(this.offer)} asked for ${item.name}.`);
    this.showOffer();
  },

  whoOf(o) {
    if (o.party) return o.party.length === 2 ? `${o.party[0].name} and ${o.party[1].name}` : `${o.party[0].name}, ${o.party[1].name} and ${o.party[2].name}`;
    return o.npc ? o.npc.name : o.patron ? "A wealthy patron" : cap(o.stranger);
  },

  showOffer() {
    const o = this.offer;
    const realDC = o.baseDC + o.type.dc;
    const shownDC = o.revealed ? realDC : o.baseDC;
    const isLimit = (state.character.limits || []).includes(o.item.id);
    const isSpec = (state.character.specialties || []).includes(o.item.id);
    const lines = [];
    if (o.couple) lines.push(`<em>${cap(o.couple.rel)}. ${o.couple.blurb}</em>`);
    else if (o.party) lines.push(`<em>${o.party.length === 2 ? "A pair" : "A party of three"} who want to share you between them${o.party.length === 2 ? "" : ", or each other"}.</em>`);
    if (o.npc && o.npc.blurb) lines.push(`<em>${cap(o.npc.blurb)}.</em>`);
    if (o.patron && !(o.spec && o.spec.name)) lines.push(`<em>Fine wool, a heavy ring, a servant waiting outside. Your name has reached the right ears.</em>`);
    if (o.spec && o.spec.trial) lines.push(`<em>The guild's examiners will judge every moment. There is no pay for a trial.</em>`);
    lines.push(`They want <b>${o.item.name}</b>.${!o.party && o.prefs.likes.includes(o.item.id) ? " It's something they love." : ""}${isSpec ? " <b>It's one of your specialties.</b>" : ""}${isLimit ? " <b>It's one of your limits.</b>" : ""}${!knows(o.item.id) && isPosition(o.item.id) ? " <em>You've never done it before; succeed and you'll learn it.</em>" : ""}`);
    const bodyNotes = (o.party ? o.party.map(m => m.prefs.body ? `${m.name} ${bodyPrefText(m.prefs.body)}${bodyMatch(m.prefs.body) > 0 ? ", and you fit the bill" : bodyMatch(m.prefs.body) < 0 ? ", and you don't" : ""}.` : "") : [o.prefs.body ? `${o.cg === "male" ? "He" : "She"} ${bodyPrefText(o.prefs.body)}${bodyMatch(o.prefs.body) > 0 ? ", and you're exactly that." : bodyMatch(o.prefs.body) < 0 ? ". You'll have to work harder." : "."}` : ""]).filter(Boolean);
    if (bodyNotes.length) lines.push(bodyNotes.join(" "));
    lines.push(o.revealed ? `\nYou read them: <b>${o.type.name}</b>. ${o.type.desc}` : o.readTried ? "\nYou couldn't get a read on them." : "\nYou haven't sized them up yet.");
    const chips = [];
    if (o.party) o.party.forEach(m => chips.push({ text: `${m.name}: ♥ ${nameOf(m.prefs.likes[0])}`, cls: "like" }));
    else {
      o.prefs.likes.forEach(id => chips.push({ text: "♥ " + nameOf(id), cls: "like" }));
      o.prefs.dislikes.forEach(id => chips.push({ text: "✕ " + nameOf(id), cls: "dislike" }));
    }
    if (o.revealed) chips.push({ text: o.type.name, cls: o.type.key === "dangerous" ? "warn" : o.type.key === "generous" ? "gold" : "calm" });
    UI.scene({ kicker: o.spec && o.spec.trial ? "Rank trial" : o.couple ? "A couple arrives" : o.party ? "A group approaches" : "A client approaches", title: this.whoOf(o), body: lines.join("\n"), chips, roll: this.lastRoll,
      html: actPanel({ item: o.item, curMove: o.item, party: o.party, climax: 1, climaxMax: 1 }, true) });

    const meta = skillMeta(o.item.skill, { bonus: techBonus(o.item.id) });
    const ch = [];
    if (!o.readTried) {
      const rdc = (o.type.key === "dangerous" ? 13 : 11) + Math.floor(o.tier / 2);
      const im = skillMeta("insight", { bonus: readBonus() });
      ch.push({ label: "Size them up", hint: "Insight · reveals what kind of client this is", odds: odds(im, rdc), action: () => {
        o.readTried = true;
        if (check(im, rdc).success) o.revealed = true;
        this.showOffer();
      } });
    }
    if (!o.drinkOffered) {
      ch.push({ label: "Pour them a drink", hint: "Lowers their guard · stress −1/round during the encounter", action: () => {
        o.drinkOffered = true; o.drinkAccepted = true;
        this.showOffer();
      } });
    } else if (o.drinkAccepted) {
      ch.push({ label: "Wine poured", hint: "They're warming up · stress −1/round", quiet: true, disabled: true });
    }
    ch.push({ section: "Terms" });
    const payHint = o.gross ? `~${o.gross} coin · ` : "";
    const drink = o.drinkAccepted || false;
    ch.push({ label: o.spec ? "Begin" : "Accept", hint: `${payHint}stress +${o.stress} · ${meta.label} per round${o.revealed ? "" : " · odds before reading"}`, odds: odds(meta, shownDC), primary: true,
      action: () => this.beginEncounter({ dc: realDC, gross: o.gross, stress: o.stress, drink }) });
    if (state.inspiration) {
      ch.push({ label: o.spec ? "Begin, inspired" : "Accept, inspired", hint: `${o.gross ? `~${o.gross + 4} coin · ` : ""}advantage on the first round · spends Inspiration`, odds: chanceOf(meta.bonus, shownDC, true, meta.dis), action: () => this.beginEncounter({ dc: realDC, gross: o.gross ? o.gross + 4 : 0, stress: Math.max(1, o.stress - 2), inspiration: true, drink }) });
    }
    if (!o.spec) {
      if (state.control >= 60) {
        ch.push({ label: "Name your price", hint: `~${Math.round(o.gross * 1.3)} coin · harder to please · Control 60+`, odds: odds(meta, shownDC + 1),
          action: () => this.beginEncounter({ dc: realDC + 1, gross: Math.round(o.gross * 1.3), stress: o.stress + 1, drink }) });
      }
      const pm = skillMeta("persuasion");
      ch.push({ label: "Negotiate gentler terms", hint: `~${Math.floor(o.gross * 0.65)} coin · success: easier and calmer`, odds: odds(pm, realDC), action: () => {
        const r = check(pm, realDC);
        const g = Math.floor(o.gross * 0.65);
        if (r.success) this.beginEncounter({ dc: realDC - 2, gross: g, stress: 2, note: "They agree to gentler terms.", drink });
        else this.beginEncounter({ dc: realDC, gross: g, stress: o.stress, note: "They take the lower price but won't budge on anything else.", drink });
      } });
      if (state.classFeatures.command && isKink(o.item.id)) {
        ch.push({ label: "Command the scene", hint: `~${o.gross + 6} coin · more stress`, odds: odds(meta, realDC + 1), action: () => this.beginEncounter({ dc: realDC + 1, gross: o.gross + 6, stress: o.stress + 2, drink }) });
      }
      const free = state.control >= 60 || isLimit;
      ch.push({ label: isLimit ? "Refuse: it's one of your limits" : "Turn them away", hint: free ? (isLimit ? "No penalty" : "On your own terms · no penalty (Control 60+)") : "−1 standing · −1 reputation · −2 control", quiet: !isLimit, primary: isLimit, action: () => {
        if (!free) { changeStanding(-1); state.reputation = Math.max(0, state.reputation - 1); state.control = Math.max(0, state.control - 2); }
        if (o.npc && o.npc.id) adjustRel(o.npc.id, { trust: -2 });
        this.log(`Turned away ${this.whoOf(o)}.`);
        this.menu();
      } });
    } else {
      ch.push({ label: "Not yet", hint: "Come back to this later", quiet: true, action: () => { this.offer = null; this.hook = null; this.menu(); } });
    }
    UI.choices(ch);
  },

  beginEncounter(t) {
    const o = this.offer;
    this.lastRoll = this.lastRoll && t.note ? this.lastRoll : null;
    let max = 12 + o.item.risk * 4 + o.tier + o.type.climax;
    if (!o.party) {
      if (bodyMatch(o.prefs.body) > 0) max = Math.round(max * 0.85);
      if (bodyMatch(o.prefs.body) < 0) max = Math.round(max * 1.15);
      if (o.prefs.likes.includes(o.item.id)) max = Math.max(8, max - 4);
      if (o.prefs.dislikes.includes(o.item.id)) max += 5;
    }
    let adv = state.classFeatures.showstopper ? 1 : 0;
    if (t.inspiration && state.inspiration) { state.inspiration = 0; adv += 1; }
    state.stress = clamp(state.stress + t.stress, 0, 100);
    const party = o.party ? o.party.map(m => {
      let mx = Math.round(max * 0.75);
      if (m.prefs.likes.includes(o.item.id)) mx -= 3;
      if (m.prefs.dislikes.includes(o.item.id)) mx += 4;
      if (bodyMatch(m.prefs.body) > 0) mx = Math.round(mx * 0.85);
      if (bodyMatch(m.prefs.body) < 0) mx = Math.round(mx * 1.15);
      return { ...m, max: mx, climax: mx, dress: 2 };
    }) : null;
    const rounds = 5 + (state.classFeatures.insatiable ? 1 : 0) + (party ? party.length - 1 + (state.classFeatures.ringmaster ? 1 : 0) : 0);
    state.encounter = {
      item: o.item, skill: o.item.skill, ctx: narrKey(o.tier), tier: o.tier, prefs: o.prefs, type: o.type, typeKey: o.type.key, revealed: o.revealed,
      patron: o.patron, npc: o.npc, cg: o.cg, who: this.whoOf(o), spec: o.spec, couple: o.couple || null, curMove: o.item, dc: t.dc, gross: t.gross,
      climax: max, climaxMax: max, round: 1, maxRounds: rounds, party, focus: 0, unlocks: [],
      dress: isKink(o.item.id) ? 1 : 2, selfDress: 2,
      arousal: 0,
      drinkActive: !!t.drink,
      advantageRounds: adv, lastMoveId: null, repeat: 0, combo: 0,
      text: t.note || (t.drink ? "You've had a glass together. The room is warmer already." : "You take them to bed.")
    };
    this.offer = null;
    const en = state.encounter;
    if (party) syncFocus(en);
    if (Narrator.on()) en.text = (t.note ? t.note + " " : "") + Narrator.open(en);
    this.encounterRound();
  },

  planAction(kind, pos) {
    const e = state.encounter;
    const p = { kind, pos, skill: pos.skill, dcMod: 0, dmg: 3 + (pos.risk || 1), stress: 2, energy: 6, moveId: pos.id };
    if (kind === "tease") { Object.assign(p, { skill: "performance", dcMod: -2, dmg: 2, stress: 1, moveId: "tease" }); }
    else if (kind === "focus") { Object.assign(p, { dcMod: 2, dmg: 4 + (pos.risk || 1), stress: 3, energy: 8 }); }
    else if (kind === "recover") { Object.assign(p, { skill: "insight", dcMod: -1, dmg: 1, stress: state.classFeatures.soothing ? -4 : -2, energy: 3, moveId: "recover" }); }
    else if (kind === "command") { Object.assign(p, { skill: "kink", dcMod: 1, dmg: 4 + (pos.risk || 1), stress: 2, moveId: "command" }); }
    else if (kind === "together") { Object.assign(p, { skill: "performance", dcMod: 0, dmg: 3 + (pos.risk || 1), stress: 3, energy: 8, moveId: "together" }); }
    else if (kind === "undress") { Object.assign(p, { skill: "performance", dcMod: -1, dmg: 2, stress: 1, energy: 4, moveId: "undress" }); }
    else if (kind === "rush") { Object.assign(p, { skill: "manual", dcMod: -2, dmg: 1, stress: 1, energy: 3, moveId: "rush" }); }
    else if (kind === "strip") { Object.assign(p, { skill: "performance", dcMod: 0, dmg: 3, stress: 1, energy: 4, moveId: "strip" }); }
    else {
      const preferred = [...(CLASS_POSITIONS[state.character.class] || []), ...(SUBCLASS_POSITIONS[state.character.subclass] || [])];
      if (preferred.includes(pos.id)) p.dmg += 1;
    }
    if (state.classFeatures.frail) p.energy += 2;
    if (state.classFeatures.tireless) p.energy = Math.max(2, p.energy - 1);
    if (state.classFeatures.ironHips && p.skill === "vaginal") p.energy = Math.max(2, p.energy - 2);
    if (state.classFeatures.slender && (p.skill === "oral" || p.skill === "manual")) p.energy = Math.max(2, p.energy - 1);
    if ((kind === "work" || kind === "focus") && isPosition(pos.id) && e.dress) p.dmg = Math.max(1, p.dmg - e.dress);
    p.repeat = kind !== "recover" && p.moveId === e.lastMoveId ? e.repeat + 1 : 0;
    if (p.repeat) p.dmg = Math.max(1, p.dmg - 2 * p.repeat);
    p.dc = Math.max(6, e.dc + p.dcMod);
    let bonus = (kind === "work" || kind === "focus") ? techBonus(pos.id) : 0;
    if (state.classFeatures.freckles && e.typeKey === "nervous") bonus += 1;
    p.meta = skillMeta(p.skill, { advantage: e.advantageRounds > 0, bonus });
    p.odds = odds(p.meta, p.dc);
    return p;
  },

  encounterRound() {
    const e = state.encounter;
    if (!e) { this.menu(); return; }
    if (e.party) {
      if (e.party.every(m => m.climax <= 0)) { this.finishEncounter(true); return; }
      if (e.party[e.focus].climax <= 0) { e.focus = e.party.findIndex(m => m.climax > 0); syncFocus(e); }
    } else if (e.climax <= 0) { this.finishEncounter(true); return; }
    if (e.round > e.maxRounds || state.energy < 6) { this.finishEncounter(false); return; }

    const pct = Math.round((1 - Math.max(0, e.climax) / e.climaxMax) * 100);
    const mood = pct < 30 ? "still cold — you haven't gotten to them yet" : pct < 70 ? "turned on and building" : "close to the edge";
    const chips = [];
    if (e.combo > 1) chips.push({ text: `Rhythm ×${e.combo}`, cls: "gold" });
    if (e.lastMoveId && e.repeat) chips.push({ text: "Getting repetitive", cls: "warn" });
    if (e.advantageRounds) chips.push({ text: "Advantage this round", cls: "gold" });
    if (e.drinkActive) chips.push({ text: "Wine · stress −1/round", cls: "calm" });
    e.prefs.likes.forEach(id => chips.push({ text: "♥ " + nameOf(id), cls: "like" }));
    const drinkBar = e.drinkActive ? `<div class="drink-bar"><div class="lbl"><span>🍷 Warmth</span><span>active</span></div><div class="track"><div class="fill" style="width:${clamp((e.arousal || 0) * 0.6 + 40, 0, 100)}%"></div></div></div>` : "";
    const arousalBar = `<div class="bigmeter" style="margin-top:8px"><div class="lbl"><span>Arousal</span><span>${e.arousal || 0}%</span></div><div class="track" style="background:#3a2c22"><div class="fill" style="height:100%;border-radius:5px;width:${clamp(e.arousal || 0, 0, 100)}%;background:#e05c7a;transition:width .3s"></div></div></div>`;
    const dressNote = dressKicker(e.dress, e.selfDress);
    UI.scene({
      kicker: `${e.spec && e.spec.trial ? "Rank trial · " : ""}Round ${e.round} of ${e.maxRounds}${dressNote}`,
      title: e.party ? `With ${e.npc.name}` : e.who,
      body: Narrator.on() ? e.text : `${e.text}\n<em>They are ${mood}.</em>`,
      html: bodyViz(e) + actPanel(e) + arousalBar + drinkBar,
      meter: { label: e.party ? `${e.npc.name} — ${satisfactionPhrase(pct)}` : satisfactionPhrase(pct), value: pct, pips: { max: e.maxRounds, used: e.round - 1 } },
      roll: this.lastRoll, chips
    });

    const limits = state.character.limits || [];
    const opt = (kind, pos, label, extra) => {
      const p = this.planAction(kind, pos);
      const notes = [];
      if (extra) notes.push(extra);
      if (p.repeat) notes.push("repeating — weaker");
      if (kind === "work" || kind === "focus") {
        if (e.prefs.likes.includes(pos.id)) notes.push(e.party ? `${e.npc.name} loves this` : "they love this");
        else if (e.prefs.dislikes.includes(pos.id)) notes.push(e.party ? `${e.npc.name} dislikes this` : "they dislike this");
        const tier = masteryTier(pos.id);
        if (tier) notes.push(MASTERY_NAMES[tier]);
      }
      notes.push(`${p.meta.label} · −${p.energy} energy`);
      return { kind, label, hint: notes.join(" · "), odds: p.odds, disabled: state.energy < p.energy, reason: "Not enough energy", action: () => this.doRound(kind, pos) };
    };
    const short = o => { o.hint = o.hint.replace(/ · −\d+ energy$/, ""); return o; };

    const list = [opt("work", e.item, `${e.item.name}`, "what they asked for")];
    list[0].primary = true;
    if (e.party) {
      const others = e.party.map((m, i) => ({ m, i })).filter(x => x.i !== e.focus && x.m.climax > 0);
      if (others.length) list.push({ section: "Turn your attention to" }, { grid: others.map(({ m, i }) => ({
        label: m.name, hint: `${Math.round((1 - m.climax / m.max) * 100)}% · loves ${nameOf(m.prefs.likes[0])}`,
        action: () => { e.focus = i; syncFocus(e); this.encounterRound(); } })) });
    }
    const tech = state.knownPositions.filter(id => isPosition(id) && id !== e.item.id).map(id => short(opt("work", getPosition(id), getPosition(id).name)));
    if (tech.length) list.push({ section: "Switch position" }, { grid: tech });
    const kinks = knownKinks().filter(id => id !== e.item.id && !limits.includes(id)).map(id => short(opt("work", anyItem(id), anyItem(id).name)));
    if (kinks.length) list.push({ section: "Switch to a kink" }, { grid: kinks });
    list.push({ section: "Approach" });
    if (e.party) list.push(opt("together", e.item, "Bring them together", "everyone feels it"));
    if (e.dress || e.selfDress) {
      const g = garments(e.cg);

      const und = [];
      if (e.dress) {
        und.push(short(opt("undress", e.item, `Undress ${e.party ? e.npc.name : "them"} slowly`, "builds anticipation")));
        und.push(short(opt("rush", e.item, `${e.cg === "male" ? "Tug open" : "Hitch up"} ${their} ${g.lower}`, "quick, bares them at once")));
      }
      if (e.selfDress) und.push(short(opt("strip", e.item, "Undress for them", "a show of your own")));
      list.push({ section: e.dress ? `Clothes (${e.dress === 2 ? "still dressed" : "loosened"}: positions −${e.dress})` : "Clothes" }, { grid: und });
    }
    list.push(opt("focus", e.curMove || e.item, "Push harder", "big progress, harder"));
    list.push(opt("tease", e.item, "Tease and talk", "safe, slow"));
    list.push(opt("recover", e.item, "Pull back and breathe", "eases your stress"));
    if (state.classFeatures.command) list.push(opt("command", e.item, "Take command", "Dominatrix"));
    list.push({ label: "End it early", hint: "They leave unsatisfied — costs standing", quiet: true, danger: true, action: () => this.finishEncounter(false) });
    UI.choices(list);
  },

  doRound(kind, pos) {
    const e = state.encounter;
    if (!e) { this.menu(); return; }
    const p = this.planAction(kind, pos);
    if (state.energy < p.energy) { e.text = "You're too spent to go on."; this.finishEncounter(false); return; }
    state.energy -= p.energy;
    if (e.advantageRounds > 0) e.advantageRounds--;
    const r = check(p.meta, p.dc);
    let stress = p.stress;
    let text = { tease: "You work them up slowly — hands and mouth, nothing finished yet.", focus: `You push hard into ${pos.name}, giving them everything.`, recover: "You ease off, let them catch their breath, keep them wanting.", command: "You take over — your hands, your pace, your terms.", together: "You bring them all in at once." }[kind] || `You move into ${pos.name}.`;

    const switched = isTech && e.curMove && e.curMove.id !== pos.id;
    if (isTech) e.curMove = pos;

    if (r.success) {
      let dealt = p.dmg + Math.max(0, Math.floor((r.total - p.dc) / 3));
      if (liked) { dealt += 2; text += " They love it — exactly what they wanted."; }
      else if (disliked) { dealt = Math.max(1, dealt - 2); text += " They endure it. Not what they came for."; }
      if (p.moveId !== e.lastMoveId && kind !== "recover") e.combo = Math.min(3, e.combo + 1);
      const combo = Math.max(0, e.combo - 1);
      dealt += combo;
      text += p.repeat ? " You're repeating yourself — they can feel it." : combo ? " You've got them where you want them." : " It works.";
      if (e.party) {
        if (kind === "together") {
          const share = state.classFeatures.ringmaster ? 0.9 : 0.7;
          e.party.forEach(m => { if (m.climax > 0) m.climax -= Math.max(1, Math.round(dealt * share)); });
        } else {
          const spill = state.classFeatures.crowdPleaser ? 0.6 : 0.35;
          e.party.forEach((m, i) => { if (m.climax <= 0) return; m.climax -= i === e.focus ? dealt : Math.floor(dealt * spill); });
        }
        syncFocus(e, true);
      } else e.climax -= dealt;
      if (state.classFeatures.thickSkinned) stress = Math.max(stress < 0 ? stress : 0, stress - 1);
      if (kind === "undress") e.dress = Math.max(0, e.dress - 1);
      if (kind === "rush") e.dress = 0;
      if (kind === "strip") e.selfDress = 0;
      if (e.party) e.party[e.focus].dress = e.dress;
    } else {
      if (e.party) { e.party[e.focus].climax -= 1; syncFocus(e, true); } else e.climax -= 1;
      e.combo = 0;
      stress += state.classFeatures.nervous ? 3 : 2;
      state.control = Math.max(0, state.control - 1);
      text += p.repeat ? " They've had enough of that — you can see it on their face." : " It doesn't work. They pull back. You scramble to recover.";
    }
    if (stress > 0) stress += Math.floor(state.trauma / 25);
    if (stress > 0 && state.classFeatures.unflappable) stress -= 1;
    if (e.drinkActive && stress > 0) stress = Math.max(0, stress - 1); // wine buffers stress slightly
    state.stress = clamp(state.stress + stress, 0, 100);
    // Practice makes perfect: every round trains the skill used and builds mastery of the technique.
    trainFromRound(p.skill, isTech ? pos.id : null, r.success);
    e.unlocks.push(...checkUnlocks());
    // Player arousal: builds per round, spikes on liked positions, pops on orgasm.
    if (isTech || kind === "command" || kind === "together") {
      const playerLikes = (state.character.likes || []);
      let gain = 5;
      if (playerLikes.includes(pos.id)) gain += 12;
      if (r.success) gain += 3;
      e.arousal = Math.min(100, (e.arousal || 0) + gain);
      // Decrement climaxing flag from previous round
      if (e.climaxing > 0) {
        e.climaxing--;

      }
      if (e.arousal >= 100) {
        e.arousal = 0;
        e.climaxing = 2; // show climax overlay for 2 rounds
        const posKey = (TECH_INFO[pos.id] || ["heart"])[0];
        const climaxLines = {
          face: "you arch back into it, thighs locking around them, and come apart — you can feel it everywhere at once",
          ontop: "you bear down hard, grinding through the peak, breathless and shaking on top of them",
