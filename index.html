<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medieval Courtesan</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f0b09">
<style>
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-display: swap; src: url(fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-display: swap; src: url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 700; font-display: swap; src: url(fonts/cormorant-garamond-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 400; font-display: swap; src: url(fonts/eb-garamond-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: italic; font-display: swap; src: url(fonts/eb-garamond-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-display: swap; src: url(fonts/eb-garamond-latin-500-normal.woff2) format("woff2"); }
  :root {
    --bg: #0f0b09;
    --card: #1c1511;
    --card2: #251c16;
    --line: #382a20;
    --line2: #5a4431;
    --ink: #efe3d3;
    --ink2: #c8b59d;
    --mute: #8f7a63;
    --gold: #e2bf7a;
    --c-coin: #e2bf7a;
    --c-rep: #d98ab0;
    --c-fame: #f0d48a;
    --c-energy: #e8a65a;
    --c-health: #8cc28f;
    --c-stress: #e0705a;
    --c-control: #6fb6b0;
    --c-trauma: #a68ad9;
    --c-xp: #c9b3ff;
    --good: #8cc28f;
    --mid: #e8b65a;
    --bad: #e0705a;
    --r: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1100px 600px at 50% -220px, #2c1b12 0%, var(--bg) 62%) fixed var(--bg);
    color: var(--ink);
    font: 17px/1.5 "EB Garamond", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 600px; margin: 0 auto; padding: 0 14px 96px; min-height: 100vh; }

  /* HUD */
  .hud { position: sticky; top: 0; z-index: 5; padding: 10px 0 6px; background: linear-gradient(var(--bg) 78%, transparent); }
  .hud-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .brand { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: 1.2rem; color: var(--gold); letter-spacing: .04em; }
  .when { font-size: .82rem; color: var(--ink2); text-align: right; }
  .purse { display: flex; gap: 14px; flex-wrap: wrap; font-size: .84rem; color: var(--mute); margin: 2px 0 8px; }
  .purse b { font-weight: 500; }
  .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .m { font-size: .66rem; color: var(--mute); text-transform: uppercase; letter-spacing: .07em; }
  .m .row { display: flex; justify-content: space-between; }
  .m .row span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: #2b211b; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .fill { height: 100%; border-radius: 3px; transition: width .35s ease; }
  .deltas { min-height: 24px; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .delta { font-size: .74rem; padding: 1px 9px; border-radius: 999px; background: #241a14; border: 1px solid var(--line); animation: pop 3s ease forwards; font-variant-numeric: tabular-nums; }
  .delta.good { color: var(--good); } .delta.bad { color: var(--bad); }
  @keyframes pop { 0% { opacity: 0; transform: translateY(4px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* Scene */
  .scene { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 14px; margin: 4px 0 12px; box-shadow: 0 12px 30px #0007; animation: fade .25s ease; }
  @keyframes fade { from { opacity: .3; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .kicker { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .scene h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.6rem; margin: 2px 0 8px; color: var(--gold); font-weight: 600; line-height: 1.12; }
  .body { white-space: pre-line; }
  .act { display: flex; align-items: center; gap: 12px; margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; background: #160f0c; }
  .act-ico svg { width: 42px; height: 42px; stroke: var(--gold); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .act-txt { flex: 1; min-width: 0; }
  .act-k { font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .act-n { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.2rem; line-height: 1.15; }
  .act-p { font-size: .8rem; color: var(--ink2); }
  .mast { font-family: "EB Garamond", Georgia, serif; font-size: .7rem; color: var(--gold); border: 1px solid #7a6232; border-radius: 999px; padding: 0 6px; vertical-align: middle; }
  .heat { display: flex; gap: 1px; }
  .heat svg { width: 15px; height: 15px; stroke: #5a4431; fill: none; stroke-width: 1.6; display: block; }
  .heat .on svg { stroke: var(--c-stress); fill: #e0705a55; }
  .party { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 8px; }
  .pm { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: .8rem; }
  .pm.on { border-color: var(--gold); background: #22180f; }
  .pm.done { opacity: .55; }
  .pmt { flex: 1; min-width: 0; } .pmm { color: var(--mute); font-size: .72rem; }
  .pm .track { margin: 2px 0; }
  .av { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; color: #0f0b09; }
  .av.male { background: #8fb4d9; } .av.female { background: #d98ab0; }
  .speech { position: relative; margin: 4px 0 12px; padding: 10px 14px; background: #2a1f17; border: 1px solid var(--line2); border-radius: 12px 12px 12px 3px; font-style: italic; color: var(--ink); }
  .body em { color: var(--ink2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { font-size: .74rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--ink2); }
  .chip.like { border-color: #4f7a52; color: #a9d6ab; }
  .chip.dislike { border-color: #7a4a3f; color: #e7a291; }
  .chip.gold { border-color: #7a6232; color: var(--gold); }
  .chip.warn { border-color: #7a3a2f; color: #eaa08f; }
  .chip.calm { border-color: #2f5d59; color: #9fd3cd; }
  .chip.chip-tap { cursor: pointer; user-select: none; }
  .chip.chip-tap:active { opacity: .75; }
  .chip.chip-open { border-color: var(--ink2); color: var(--ink); background: var(--card2); }
  .tech-detail { width: 100%; margin: 4px 0 8px; padding: 10px 14px; background: var(--card2); border-left: 2px solid var(--line2); border-radius: 4px; font-size: .82rem; color: var(--ink2); font-style: italic; line-height: 1.55; }
  .tech-detail p { margin: 0; }
  .bigmeter { margin-top: 14px; }
  .bigmeter .lbl { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink2); }
  .bigmeter .track { height: 10px; border-radius: 5px; }
  .pips { display: flex; gap: 4px; margin-top: 8px; }
  .pip { flex: 1; height: 4px; background: #3a2c22; border-radius: 2px; }
  .pip.on { background: var(--gold); }
  .roll { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #140f0c; border-left: 3px solid var(--mute); font-size: .86rem; }
  .roll.ok { border-left-color: var(--good); } .roll.no { border-left-color: var(--bad); }
  .roll .res { font-weight: 500; } .roll.ok .res { color: var(--good); } .roll.no .res { color: var(--bad); }
  .roll .math { color: var(--mute); font-variant-numeric: tabular-nums; }
  .die { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: 8px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: 1.15rem; background: #22180f; color: var(--gold); animation: tumble .5s cubic-bezier(.2,.8,.3,1.2); }
  .die.ghost { opacity: .45; width: 26px; height: 26px; font-size: .9rem; animation: none; }
  @keyframes tumble { 0% { transform: rotate(-220deg) scale(.5); opacity: 0; } 100% { transform: none; opacity: 1; } }

  /* Choices */
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .sect { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin: 8px 2px -2px; }
  .btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: var(--r); padding: 11px 13px; font: inherit; cursor: pointer; transition: background .15s, border-color .15s, transform .06s; }
  .btn:hover:not(:disabled) { background: #2a1f19; border-color: var(--line2); }
  .btn:active:not(:disabled) { transform: scale(.985); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn .txt { flex: 1; min-width: 0; }
  .btn .lbl { display: block; }
  .btn .hint { display: block; font-size: .8rem; color: var(--mute); line-height: 1.35; margin-top: 1px; }
  .btn.primary { border-color: #7a6232; background: linear-gradient(180deg, #382816, #261b12); }
  .btn.primary .lbl { color: var(--gold); }
  .btn.danger .lbl { color: #eaa08f; }
  .btn.quiet { background: transparent; }
  .odds { flex: none; font-size: .78rem; font-variant-numeric: tabular-nums; padding: 2px 9px; border-radius: 999px; border: 1px solid; }
  .odds.hi { color: var(--good); border-color: #3f6542; }
  .odds.md { color: var(--mid); border-color: #6b5228; }
  .odds.lo { color: var(--bad); border-color: #6b3328; }
  .price { flex: none; font-size: .82rem; color: var(--gold); font-variant-numeric: tabular-nums; }
  /* Action button accent borders by kind */
  .btn-work  { border-left: 3px solid #c9993a; }
  .btn-focus { border-left: 3px solid #c9993a; }
  .btn-tease { border-left: 3px solid #9b80c4; }
  .btn-undress { border-left: 3px solid #9b80c4; }
  .btn-strip { border-left: 3px solid #9b80c4; }
  .btn-rush  { border-left: 3px solid #9b80c4; }
  .btn-recover { border-left: 3px solid #5da8c0; }
  .btn-command { border-left: 3px solid #c45a5a; }
  .btn-together { border-left: 3px solid #c9993a; }
  /* Drink / substance bar */
  .drink-bar { margin-top: 8px; }
  .drink-bar .lbl { display: flex; justify-content: space-between; font-size: .76rem; color: #d98ab0; margin-bottom: 3px; }
  .drink-bar .track { height: 8px; border-radius: 4px; background: #3a1e2c; }
  .drink-bar .fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #c45a8a, #e07aaa); transition: width .4s; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 .btn { padding: 9px 10px; }
  /* Body visualization */
  .body-viz { display: flex; align-items: center; gap: 14px; margin: 12px 0 8px; padding: 12px 14px; background: #100b08; border: 1px solid var(--line); border-radius: 10px; }
  .body-viz-fig { position: relative; flex: none; }
  .body-viz-fig img.fig-icon { width: 96px; height: 128px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .body-viz { display: flex; align-items: flex-start; gap: 12px; }
  .body-viz.has-img { flex-direction: row; }
  .viz-pos-img { flex-shrink: 0; width: 100px; height: 100px; border-radius: 8px; overflow: hidden; background: var(--surface2); border: 1px solid var(--border); }
  .viz-pos-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .viz-pos-img.climax-flash img { animation: climax-flare 0.4s ease-in-out; }
  /* portrait system */
  .portrait-wrap { display:flex; align-items:flex-start; gap:14px; margin-bottom:10px; }
  .portrait-img { width:88px; height:110px; border-radius:8px; object-fit:cover; border:2px solid var(--border); flex-shrink:0; background:var(--surface2); display:block; }
  .portrait-placeholder { width:88px; height:110px; border-radius:8px; border:2px dashed var(--border); flex-shrink:0; background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:.75rem; text-align:center; padding:6px; box-sizing:border-box; cursor:pointer; }
  .portrait-placeholder:hover { border-color:var(--gold); color:var(--gold); }
  .portrait-meta { flex:1; min-width:0; }
  .portrait-upload-btn { margin-top:6px; font-size:.8rem; color:var(--mute); cursor:pointer; text-decoration:underline; }
  .portrait-upload-btn:hover { color:var(--gold); }
  .npc-portrait { width:40px; height:50px; border-radius:5px; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
  .npc-portrait-placeholder { width:40px; height:50px; border-radius:5px; border:1px solid var(--border); background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:1.2rem; flex-shrink:0; }
  .staff-inner { display:flex; gap:10px; align-items:flex-start; }
  .staff-body { flex:1; min-width:0; }
  .body-viz-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .viz-pos-label { font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .viz-pos-name { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; line-height: 1.2; }
  .viz-arousal-label { font-size: .78rem; color: var(--ink2); margin-top: 2px; }
  .viz-dress-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .viz-dress-tag { font-size: .7rem; padding: 1px 8px; border-radius: 999px; border: 1px solid; }
  .viz-dress-tag.patron { border-color: #7a6232; color: #c9993a; background: #1e1509; }
  .viz-dress-tag.self { border-color: #5a4a7a; color: #9b80c4; background: #100e18; }
  @keyframes arousal-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  .fig-hot { animation: arousal-pulse 1.1s ease-in-out infinite; }
  /* Climax overlay flash */
  @keyframes climax-flare { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: .85; } 100% { opacity: 0; } }
  @keyframes climax-pulse { 0%, 100% { opacity: .9; } 50% { opacity: .5; } }
  @keyframes climax-spill { 0% { transform: translateY(0) scaleY(1); opacity: 1; } 100% { transform: translateY(6px) scaleY(1.4); opacity: 0; } }
  .climax-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; animation: climax-flare 2.2s ease-out forwards; }
  .climax-overlay svg { width: 96px; height: 128px; }
  .climax-closeup-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; animation: climax-flare 2.2s ease-out forwards; }
  .climax-closeup-overlay svg { display: block; }
  .fig-climax { animation: climax-pulse .6s ease-in-out infinite; }
  .climax-text { background: linear-gradient(135deg, #1a0c0c 0%, #2a1010 100%); border: 1px solid #8b1a1a66; border-radius: 6px; padding: 8px 10px; margin-top: 6px; font-size: .82rem; color: #ff8080; line-height: 1.45; font-style: italic; }
  .climax-text strong { color: #ff3a5a; font-style: normal; }
  /* Close-up detail panel */
  .body-viz-closeup { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .closeup-label { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
  .closeup-fig { display: block; background: #0c0907; border: 1px solid #2a1e18; border-radius: 6px; padding: 4px; }
  .closeup-fig img { display: block; width: 96px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; }
  @keyframes closeup-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .closeup-hot { animation: closeup-pulse 1.1s ease-in-out infinite; }

  /* Panels */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 4px 0 12px; animation: fade .25s ease; }
  .panel h3 { font-family: "Cormorant Garamond", Georgia, serif; color: var(--gold); margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
  .panel .sub { color: var(--mute); font-size: .85rem; margin: -4px 0 10px; }
  .panel .choices { margin-top: 10px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .92rem; }
  .kv > span:nth-child(odd) { color: var(--ink2); }
  .kv > span:nth-child(even) { font-variant-numeric: tabular-nums; }
  .bar-row { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: .88rem; margin: 6px 0; }
  .bar-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .attrs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .attr { text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; }
  .attr .k { font-size: .66rem; letter-spacing: .1em; color: var(--mute); }
  .attr .v { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.35rem; color: var(--gold); line-height: 1.1; }
  .attr .mod { font-size: .72rem; color: var(--ink2); }
  .feat { margin: 6px 0; font-size: .9rem; }
  .feat b { font-weight: 500; color: var(--ink); }
  .feat span { color: var(--mute); }
  .req { display: grid; grid-template-columns: 18px 1fr 70px; gap: 8px; align-items: center; font-size: .9rem; margin: 6px 0; }
  .req .ok { color: var(--good); } .req .no { color: var(--mute); }
  .req .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); }
  .staff { border-top: 1px solid var(--line); padding: 8px 0; }
  .staff:first-of-type { border-top: 0; }
  .staff .top { display: flex; justify-content: space-between; font-size: .92rem; }
  .entry { padding: 7px 0; border-top: 1px solid var(--line); font-size: .9rem; white-space: pre-line; }
  .entry:first-child { border-top: 0; }
  .entry .when { text-align: left; font-size: .7rem; color: var(--mute); letter-spacing: .06em; text-transform: uppercase; }
  .entry.roll-entry { font-size: .8rem; color: var(--ink2); }
  .empty { color: var(--mute); font-style: italic; font-size: .9rem; }
  .steps { display: flex; gap: 3px; margin: 14px 0 2px; }
  .steps span { flex: 1; height: 3px; border-radius: 2px; background: #3a2c22; }
  .steps span.done { background: #7a6232; } .steps span.on { background: var(--gold); }
  .field { display: block; margin-top: 14px; }
  .field span { display: block; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); margin-bottom: 4px; }
  .name-in { width: 100%; background: #140f0c; border: 1px solid var(--line2); border-radius: 8px; color: var(--ink); font: inherit; font-size: 1.15rem; padding: 10px 12px; }
  .name-in:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .sheet { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .sheet .attrs { grid-template-columns: repeat(6, 1fr) !important; gap: 4px; }
  .sheet .attr { padding: 4px 1px; }
  .sheet .attr .v { font-size: 1.1rem; }
  .sheet .chips { margin-top: 8px; }
  .sk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px 8px; margin-top: 10px; font-size: .76rem; color: var(--mute); }
  .sk b { color: var(--ink2); font-weight: 500; }
  .chg, .chg .v, .chg b { color: var(--gold) !important; }
  .attr.chg, .chip.chg { border-color: #7a6232; }
  @media (max-width: 420px) { .sk { grid-template-columns: repeat(2, 1fr); } }

  /* Tabs */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: #130d0aee; backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabs .inner { display: flex; max-width: 600px; margin: 0 auto; }
  .tab { position: relative; flex: 1; background: none; border: 0; color: var(--mute); padding: 9px 4px 11px; font: inherit; font-size: .76rem; cursor: pointer; letter-spacing: .04em; }
  .tab .ico { display: block; font-size: 1.15rem; line-height: 1.25; }
  .tab.on { color: var(--gold); }
  .tab:disabled { opacity: .3; cursor: not-allowed; }
  .tab .dot { position: absolute; top: 7px; left: 56%; width: 7px; height: 7px; border-radius: 50%; background: var(--c-stress); display: none; }
  .tab.alert .dot { display: block; }

  /* Toast */

    { ok: state.stats.successes >= n.clients, label: "Satisfied clients", val: `${state.stats.successes}/${n.clients}` },
    { ok: state.level >= n.level, label: "Level", val: `${state.level}/${n.level}` },
    { ok: state.fame >= n.fame, label: "Fame", val: `${state.fame}/${n.fame}` },
    { ok: trialCityOk(), label: n.trial === "final" ? "At the Guild Hall in Valcourt" : `In ${city(CITIES[clamp(state.rank, 0, 5)].id).name} or beyond`, val: trialCityOk() ? "✓" : "travel" }
  ];
}
function trialReady() { const r = trialReqs(); return !!r && r.every(x => x.ok); }

function clientCap() { return 3 + (state.phaseMods.extraClients || 0); }
function whyCantWork() {
  if (state.health < MIN_HEALTH_TO_WORK) return "Too injured. Rest or see a physician.";
  if (state.energy < 15) return "Too tired. Rest first.";
  if (state.flags.clientsThisPhase >= clientCap()) return `No more clients this ${state.phase}.`;
  return "";
}

function grossPay(item, patron) {
  const tier = city().tier;
  let pay = 8 + tier * 5 + (item.risk - 1) * 3;
  if (state.character.appearance === "striking") pay += 3;
  if (state.character.appearance === "plain") pay = Math.max(4, pay - 2);
  if (state.classFeatures.allure) pay += 2;
  if (state.upgrades.clothes) pay += 2;
  if (state.classFeatures.scar) pay -= 1;
  if (state.classFeatures.tattoo && tier <= 1) pay *= 1.15;
  if (state.classFeatures.bargainer) pay *= 1.1;
  pay *= 1 + state.rank * 0.08;
  pay *= 1 + clamp(state.reputation, 0, 200) / 400;
  if (state.character.motivation === "debt") pay *= 1.1;
  pay = Math.round(pay * (state.phaseMods.payMult || 1));
  if (patron) pay *= 2;
  return pay;
}

function rollClientType() {
  const types = Object.values(CLIENT_TYPES);
  const total = types.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of types) { r -= t.weight; if (r <= 0) return t; }
  return CLIENT_TYPES.ordinary;
}

function adjustRel(id, d) {
  const npc = NPCS.find(n => n.id === id);
  if (!npc) return;
  if (!state.relationships[id]) state.relationships[id] = { name: npc.name, love: 0, lust: 0, trust: 0 };
  const r = state.relationships[id];
  ["love", "lust", "trust"].forEach(k => { r[k] = clamp(r[k] + (d[k] || 0), 0, 100); });
}

      title: `${size === 2 ? "A pair" : "A party of three"}: ${item.name}`, short: `${cap(who)}, asking for ${item.name}.`,
      payMult: 1.4 + 0.15 * t, dcMod: 1 + Math.floor(t / 2), standing: 3 + t, bonus: 15 + 10 * t };
  }
  if (kind === "court") {
    const venue = pick(venues), v = VENUES[venue], cg = clientGender();
    const name = `${pick(v.titles[cg])} ${pick(SURNAMES)}`;
    return { ...base, venue, cg, name, days: 2, deadline: 0,
      title: `Charm ${name}`, short: `A friend of ${name} pays the guild to have someone win them over at the ${venue === "tavern" ? "taproom" : venue}.`,
      dcMod: 1, standing: 2 + v.scale + Math.floor(t / 2), bonus: 15 + 10 * t + 15 * v.scale };
  }
  const item = contractPool(), need = 2 + (Math.random() < 0.4 ? 1 : 0);
  return { ...base, kind: "tally", item: item.id, need, have: 0, days: need + 2, deadline: 0,
    title: `Guild order: ${item.name}`, short: `The guildhouse is short of hands who can do ${item.name}. Satisfy ${need} clients with it, in any city.`,
    standing: 2 + t + need, bonus: 20 + 12 * t + 8 * need };
}

const Game = {
  mode: "creation",
  lastRoll: null,
  confirmNew: false,
  hook: null,
  offer: null,
  dawnLines: null,

  log(text, kind = "") {
    state.journal.unshift({ d: state.day, p: state.phase, t: text, k: kind });
    if (state.journal.length > 150) state.journal.length = 150;
  },
  setMode(m) { this.mode = m; UI.setTabsLocked(m !== "menu"); },

  outcome(title, body, next, opts = {}) {
    this.setMode(opts.mode || "event");
    UI.scene({ kicker: opts.kicker || "", title, body, roll: opts.roll || null, chips: opts.chips });
    UI.choices([{ label: opts.cta || "Continue", primary: true, action: next || (() => this.menu()) }]);
  },
  runHook(success) {
    const h = this.hook;
    this.hook = null;
    if (h) h(success); else this.menu();
  },

  /* ---------- City menu ---------- */
  menu() {
    if (UI.tab !== "work") { UI.showTab("work"); return; }
    UI.renderHUD();
    this.lastRoll = null;
    this.hook = null;
    if (this.checkForcedEnding()) return;
    if (state.notices.length) { const n = state.notices.shift(); this.outcome(n.title, n.text, null, { kicker: n.kicker }); return; }
    if (state.pendingLevelUps > 0) { state.pendingLevelUps--; this.offerLevelUp(); return; }
    if (state.pendingFeats > 0) { this.offerFeat(); return; }
    if (state.stress >= 100) { this.breakdown(); return; }
    if (this.checkStory()) return;

    this.setMode("menu");
    if (state.ironman) this.save(false);
    const c = city();
    const why = whyCantWork();
    const lines = [c.blurb[state.phase]];
    if (why) lines.push(`\n<em>${why}</em>`);
    const chips = [{ text: `${rankName()} · ${state.standing} standing`, cls: state.standing < RANKS[state.rank].standing ? "warn" : "gold" }];
    if (state.phaseMods.label) chips.push({ text: state.phaseMods.label, cls: state.phaseMods.payMult >= 1 ? "gold" : "warn" });
    if (trialReady()) chips.push({ text: "Ready for your trial", cls: "gold" });
    if (state.debt) chips.push({ text: `Debt ${state.debt}${state.debtDays >= 2 ? " · creditors circling" : ""}`, cls: "warn" });
    if (state.health < lowHealthLimit()) chips.push({ text: "Injured: disadvantage", cls: "warn" });
    if (state.stress >= 75) chips.push({ text: "Near breaking point", cls: "warn" });
    if (state.trauma >= 60) chips.push({ text: `Trauma ${state.trauma} — seek sanctuary`, cls: "warn" });
    UI.scene({ kicker: `Day ${state.day} · ${c.kind}`, title: `${cap(state.phase)} in ${c.name}`, body: lines.join("\n"), chips });

    const ch = [];
    const n = nextRank();
    if (n && trialReady()) ch.push({ label: n.trial === "final" ? "Face the Guild Council" : `Face the trial for ${n.name}`, hint: state.flags.trialDay === state.day ? "" : `Promotion: ${n.purse ? n.purse + " coin and " : ""}an attribute increase`, primary: true,
      disabled: state.flags.trialDay === state.day, reason: "You've already faced a trial today. Try again tomorrow.", action: () => this.startTrial() });
    if (state.coin >= retireAt() && !state.debt) ch.push({ label: "Buy out your contract and retire", hint: state.rank >= 2 ? "Ends the game" : `The guild won't release anyone below ${rankName(2)}`, primary: state.rank >= 2, disabled: state.rank < 2, reason: `The guild won't release anyone below ${rankName(2)}`, action: () => this.ending("wealthy") });

    QUESTS.filter(q => q.city === state.city && state.quests[q.id] && state.quests[q.id].status === "active").forEach(q => {
      const step = q.steps[state.quests[q.id].step];
      const tried = state.flags.questTried[q.id] === state.day;
      const tired = step.type !== "scene" && (state.energy < 15 || state.health < MIN_HEALTH_TO_WORK);
      ch.push({ label: `★ ${q.title}`, hint: step.desc, disabled: tried || tired, reason: tried ? "Try again tomorrow" : "Too tired or hurt — rest first", action: () => this.questStep(q) });
    });

    this.contractsHere().forEach(k => {
      const tired = state.energy < 15 || state.health < MIN_HEALTH_TO_WORK;
      const busy = k.kind === "court" ? state.flags.courtedThisPhase : !!why;
      ch.push({ label: `✦ ${k.title}`, hint: `${k.short} · ${daysLeft(k)}`, disabled: tired || busy, reason: tired ? "Too tired or hurt — rest first" : k.kind === "court" ? "You've already courted this phase" : why, action: () => this.fulfilContract(k) });
    });

    const left = clientCap() - state.flags.clientsThisPhase;
    ch.push({ section: "Work" });
    // Returning client — someone seeking you out specifically
    const rc = state.flags.repeatClient;
    if (rc && !why) {
      const rcItem = anyItem(rc.item);
      const rcLabel = cbAffinityLabel && rc.clientKey ? cbAffinityLabel((state.clientBook[rc.clientKey] || {}).affinity || 0) : null;
      const rcHint = `${rcItem ? rcItem.name : rc.item} · ${rcLabel ? rcLabel + " · " : ""}${rc.blurb || "asking for you by name"}`;
      ch.push({ label: `✦ ${rc.name} is asking for you`, hint: rcHint, primary: false,
        action: () => {
          state.flags.repeatClient = null;
          this.startEncounter(rc);
        }
      });
    }
    ch.push({ label: "Look for a client", hint: `${left} more this ${state.phase} · base pay ~${grossPay(INDEX.positions[0], false)}`, disabled: !!why, reason: why, action: () => this.startEncounter() });
    Object.keys(VENUES).forEach(k => {
      const v = VENUES[k];
      if (!c.venues.includes(k)) return;
      const locked = state.rank < v.rank;
      const busy = state.flags.courtedThisPhase;
      const tired = state.energy < 10;
      ch.push({ label: v.name, hint: `${societyFatigue() ? `Society is tiring of you (+${2 * societyFatigue()} difficulty) · ` : ""}Courtship · ${k === "tavern" ? "win a well-off patron" : k === "salon" ? "merchants, magistrates and minor nobility" : "the high nobility"}`,
        disabled: locked || busy || tired, reason: locked ? `Requires ${rankName(v.rank)}` : busy ? `Once per phase` : "Too tired. Rest first.", action: () => this.startCourt({ venue: k }) });
    });
    this.refreshBoard();
    const posted = state.contracts.board.length, act = state.contracts.active.length;
    ch.push({ label: "Read the contract board", hint: `${posted ? `${posted} posting${posted === 1 ? "" : "s"}` : "Nothing posted"} · ${act}/${maxContracts()} contracts taken`, action: () => this.board() });
    const avail = this.questsHere().length;
    ch.push({ label: "Ask around the guildhouse", hint: avail ? `${avail} ${avail === 1 ? "person needs" : "people need"} a favor` : "No new work here right now", disabled: !avail, reason: "No new work here right now", action: () => this.askAround() });

    ch.push({ label: "Train at the guildhouse", hint: `Pay a tutor to raise a skill or master a technique · once per ${state.phase}`, disabled: state.flags.trainedThisPhase || state.energy < 15, reason: state.flags.trainedThisPhase ? `Already trained this ${state.phase}` : "Too tired to train", action: () => this.train() });
    ch.push({ section: "Rest" });
    ch.push({ label: "Rest", hint: state.flags.clientsThisPhase ? "A fair recovery after work" : "Light rest — you haven't worked", disabled: state.flags.restedThisPhase, reason: "Already rested this phase", action: () => this.rest() });
    if (state.debt) ch.push({ label: "Pay down debt", hint: `Owed ${state.debt} · 5% interest daily`, disabled: state.coin < 1, reason: "No coin", action: () => this.payDebt() });
    const duesDay = state.phase === "night" && (state.day + 1) % 7 === 0;
    ch.push({ label: PHASE_END[state.phase], hint: state.phase === "night" ? `Lodging ${lodging()}${duesDay ? ` + guild dues ${this.dues()}` : ""} due at dawn` : "", quiet: true, action: () => this.endPhase() });
    UI.choices(ch);
  },

  refresh() { if (UI.tab === "work") this.menu(); else UI.renderView(); },

  offerFeat() {
    this.setMode("event");
    const avail = Object.keys(FEATS).filter(k => !(state.feats || []).includes(k));
    UI.scene({ kicker: "A new feat", title: "Choose a feat", body: "Experience has sharpened you. Choose one feat; some require high enough attributes or skills." });
    UI.choices(avail.map(k => {
      const f = FEATS[k], met = featReqMet(state, f), req = featReqText(f);
      return { label: f.name, hint: f.desc + (req ? ` · requires ${req}` : ""), disabled: !met, reason: `${f.desc} · requires ${req}`, action: () => {
        state.feats = [...(state.feats || []), k];
        state.classFeatures[k] = true;
        state.pendingFeats = Math.max(0, (state.pendingFeats || 0) - 1);
        this.log(`Learned the feat ${f.name}.`);
        this.menu();
      } };
    }).concat(avail.some(k => featReqMet(state, FEATS[k])) ? [] : [{ label: "Nothing fits yet", hint: "Raise your attributes or skills; this feat choice is saved for later", quiet: true, action: () => { state.pendingFeats = 0; state.savedFeats = (state.savedFeats || 0) + 1; this.menu(); } }]));
  },

  offerLevelUp() {
    this.setMode("event");
    UI.scene({ kicker: "Improvement", title: "An attribute improves", body: `Choose an attribute to raise by one.${state.pendingLevelUps ? `\n<em>${state.pendingLevelUps} more after this.</em>` : ""}` });
    UI.choices(["str", "dex", "con", "int", "wis", "cha"].map(a => ({
      label: `${a.toUpperCase()} ${state.attributes[a]} → ${Math.min(20, state.attributes[a] + 1)}`,
      hint: ATTR_USE[a],
      disabled: state.attributes[a] >= 20, reason: "Maxed",
      action: () => {
        state.attributes[a] = Math.min(20, state.attributes[a] + 1);
        this.log(`${a.toUpperCase()} rose to ${state.attributes[a]}.`);
        this.menu();
      }
    })));
  },

  /* ---------- Encounters ---------- */
  // spec (optional): { name, cg, blurb, typeKey, item, dcMod, payMult, patron, trial, noTrouble }
  startEncounter(spec) {
    if (!spec) {
      const why = whyCantWork();
      if (why) { UI.toast(why); this.menu(); return; }
      state.flags.clientsThisPhase++;
    } else if (state.energy < 15 || state.health < MIN_HEALTH_TO_WORK) {
      UI.toast("Too tired or hurt. Rest first."); this.hook = null; this.menu(); return;
    }
    this.setMode("encounter");
    const c = city();
    const limits = state.character.limits || [];
    const specs = (state.character.specialties || []).map(anyItem).filter(Boolean);
    const groupOdds = 0.07 + 0.03 * c.tier + (state.classFeatures.crowdPleaser || state.classFeatures.ringmaster ? 0.05 : 0);
    const group = spec ? !!spec.group : Math.random() < groupOdds;
    const n = group ? (spec && spec.group ? spec.group : Math.random() < 0.75 ? 2 : 3) : 1;
    const makePrefs = () => {
      const all = [...INDEX.positions, ...INDEX.kinks].map(x => x.id).sort(() => Math.random() - 0.5);
      const likes = [Math.random() < 0.6 ? pick(c.tastes) : all[0]];
      likes.push(all.find(id => !likes.includes(id)));
      return { likes, dislikes: all.filter(id => !likes.includes(id)).slice(0, 2) };
    };
    const prefs = makePrefs();
    prefs.body = rollBodyPref();

    let item;
    if (spec && spec.item) item = anyItem(spec.item);
    else {
      const useKink = Math.random() > 0.5;
      let pool = useKink ? INDEX.kinks : INDEX.positions.filter(p => knows(p.id));
      if (state.level < 3) pool = pool.filter(x => x.risk <= 2);
      if (!pool.length) pool = [INDEX.positions[0]];
      item = pick(pool);
      const liked = pool.find(x => prefs.likes.includes(x.id) && !limits.includes(x.id));
      if (liked && Math.random() < 0.5) item = liked;
      if (useKink && specs.length && Math.random() < 0.35) item = pick(specs);
      if (!useKink && Math.random() < 0.15) {
        const fresh = INDEX.positions.filter(p => !knows(p.id) && canLearn(p.id));
        if (fresh.length) item = pick(fresh);
      }
      if (limits.includes(item.id) && Math.random() < 0.5) {
        const alt = pool.filter(x => !limits.includes(x.id));
        if (alt.length) item = pick(alt);
      }
    }
    prefs.dislikes = prefs.dislikes.filter(id => id !== item.id);

    const fameIdx = getFameIndex();
    const patron = spec ? !!spec.patron : !group && fameIdx >= 2 && Math.random() < 0.1 + 0.03 * (fameIdx - 2);
    let type = spec && spec.typeKey ? CLIENT_TYPES[spec.typeKey] : rollClientType();
    if (patron && !(spec && spec.typeKey)) type = Math.random() < 0.5 ? CLIENT_TYPES.generous : CLIENT_TYPES.demanding;
    let npc = null;
    if (spec && spec.name) npc = { id: null, name: spec.name, blurb: spec.blurb || "" };
    else if (!spec && !group && !patron && c.npcs.length) {
      const want = pick(c.npcs);
      const cand = NPCS.find(x => x.id === want);
      if (cand) {
      const fit = CLIENTELE[state.character.clientele || "anyone"].male;
      const w = NPC_GENDER[cand.id] === "male" ? fit : 1 - fit;
      if (Math.random() < 0.3 * Math.min(1, w * 2)) npc = cand;
    } }
    const COUPLE_TYPES = [
      { rel: "newlyweds", blurb: "Married three weeks ago. This is their honeymoon treat." },
      { rel: "lovers", blurb: "They've been together long enough to know exactly what they want from a night like this." },
      { rel: "a long-term couple", blurb: "Comfortable enough with each other that embarrassment isn't part of tonight." },
      { rel: "two old friends who finally crossed a line", blurb: "Something shifted between them recently. They're still figuring out what it means." },
      { rel: "a merchant and her favorite clerk", blurb: "The arrangement is open enough that this counts as a gift for both of them." },
      { rel: "a pair of officers on their last night before deployment", blurb: "One of them talked the other into this. Neither of them minds." },
      { rel: "an artist and their muse", blurb: "They've spent months studying each other. Tonight they're spending it differently." },
      { rel: "nobles who've been discreet about this for years", blurb: "The discretion is habit now. They don't need it here." }
    ];
    let party = null;
    let coupleData = null;
    if (group) {
      party = [];
      // 35% of size-2 groups are a pre-formed couple
      const isCouple = n === 2 && !spec && Math.random() < 0.35;
      if (isCouple) coupleData = pick(COUPLE_TYPES);
      for (let i = 0; i < n; i++) {
        // couples can be same-sex; use shared gender roll for visual coherence ~40% of time
        const cg = (isCouple && i === 1 && Math.random() < 0.4) ? party[0].cg : clientGender();
        let nm = pick(NAMES[cg]);
        while (party.some(m => m.name === nm)) nm = pick(NAMES[cg]);
        const mp = makePrefs(); mp.body = rollBodyPref();
        // couples share a like — the thing they came for together
        if (isCouple && i === 1) mp.likes[0] = party[0].prefs.likes[0];
        party.push({ name: nm, cg, prefs: mp });
      }
      party.forEach(m => { m.prefs.dislikes = m.prefs.dislikes.filter(id => id !== item.id); });
    }

    let dc = 8 + item.risk * 2 + c.tier + Math.floor(Math.random() * 3) + ((spec && spec.dcMod) || 0);
    if (group) dc += 1 + (state.classFeatures.shyCrowds ? 2 : 0);
    if (!group && prefs.likes.includes(item.id)) dc -= 1;
    if (!group && prefs.dislikes.includes(item.id)) dc += 2;
    const bm = group ? 0 : bodyMatch(prefs.body);
    dc -= bm;

    let gross = Math.round(grossPay(item, patron) * (spec && spec.payMult !== undefined ? spec.payMult : 1));
    if (group) gross = Math.round(gross * 0.85 * n);
    if (specs.some(x => x.id === item.id)) gross = Math.round(gross * 1.15);
    if (bm > 0) gross = Math.round(gross * 1.1);
    if (bm < 0) gross = Math.round(gross * 0.9);
    if (state.classFeatures.ropeMaster && (item.id === "bondage" || item.id === "dominance_and_submission")) gross = Math.round(gross * 1.2);

    this.offer = {
      item, prefs, type, patron, npc, party, couple: coupleData, spec: spec || null, tier: c.tier,
      stranger: pick(c.strangers),
      cg: spec && spec.cg ? spec.cg : npc && npc.id ? NPC_GENDER[npc.id] : clientGender(),
      baseDC: dc, gross,
      stress: (c.tier <= 1 ? 5 : 3) + (group ? 2 * (n - 1) : 0),
      revealed: false, readTried: false
    };
    this.log(`${this.whoOf(this.offer)} asked for ${item.name}.`);
    this.showOffer();
  },

  whoOf(o) {
    if (o.party) return o.party.length === 2 ? `${o.party[0].name} and ${o.party[1].name}` : `${o.party[0].name}, ${o.party[1].name} and ${o.party[2].name}`;
    return o.npc ? o.npc.name : o.patron ? "A wealthy patron" : cap(o.stranger);
  },

  showOffer() {
    const o = this.offer;
    const realDC = o.baseDC + o.type.dc;
    const shownDC = o.revealed ? realDC : o.baseDC;
    const isLimit = (state.character.limits || []).includes(o.item.id);
    const isSpec = (state.character.specialties || []).includes(o.item.id);
    const lines = [];
    if (o.couple) lines.push(`<em>${cap(o.couple.rel)}. ${o.couple.blurb}</em>`);
    else if (o.party) lines.push(`<em>${o.party.length === 2 ? "A pair" : "A party of three"} who want to share you between them${o.party.length === 2 ? "" : ", or each other"}.</em>`);
    if (o.npc && o.npc.blurb) lines.push(`<em>${cap(o.npc.blurb)}.</em>`);
    if (o.patron && !(o.spec && o.spec.name)) lines.push(`<em>Fine wool, a heavy ring, a servant waiting outside. Your name has reached the right ears.</em>`);
    if (o.spec && o.spec.trial) lines.push(`<em>The guild's examiners will judge every moment. There is no pay for a trial.</em>`);
    lines.push(`They want <b>${o.item.name}</b>.${!o.party && o.prefs.likes.includes(o.item.id) ? " It's something they love." : ""}${isSpec ? " <b>It's one of your specialties.</b>" : ""}${isLimit ? " <b>It's one of your limits.</b>" : ""}${!knows(o.item.id) && isPosition(o.item.id) ? " <em>You've never done it before; succeed and you'll learn it.</em>" : ""}`);
    const bodyNotes = (o.party ? o.party.map(m => m.prefs.body ? `${m.name} ${bodyPrefText(m.prefs.body)}${bodyMatch(m.prefs.body) > 0 ? ", and you fit the bill" : bodyMatch(m.prefs.body) < 0 ? ", and you don't" : ""}.` : "") : [o.prefs.body ? `${o.cg === "male" ? "He" : "She"} ${bodyPrefText(o.prefs.body)}${bodyMatch(o.prefs.body) > 0 ? ", and you're exactly that." : bodyMatch(o.prefs.body) < 0 ? ". You'll have to work harder." : "."}` : ""]).filter(Boolean);
    if (bodyNotes.length) lines.push(bodyNotes.join(" "));
    lines.push(o.revealed ? `\nYou read them: <b>${o.type.name}</b>. ${o.type.desc}` : o.readTried ? "\nYou couldn't get a read on them." : "\nYou haven't sized them up yet.");
    const chips = [];
    if (o.party) o.party.forEach(m => chips.push({ text: `${m.name}: ♥ ${nameOf(m.prefs.likes[0])}`, cls: "like" }));
    else {
      o.prefs.likes.forEach(id => chips.push({ text: "♥ " + nameOf(id), cls: "like" }));
      o.prefs.dislikes.forEach(id => chips.push({ text: "✕ " + nameOf(id), cls: "dislike" }));
    }
    if (o.revealed) chips.push({ text: o.type.name, cls: o.type.key === "dangerous" ? "warn" : o.type.key === "generous" ? "gold" : "calm" });
    UI.scene({ kicker: o.spec && o.spec.trial ? "Rank trial" : o.couple ? "A couple arrives" : o.party ? "A group approaches" : "A client approaches", title: this.whoOf(o), body: lines.join("\n"), chips, roll: this.lastRoll,
      html: actPanel({ item: o.item, curMove: o.item, party: o.party, climax: 1, climaxMax: 1 }, true) });

    const meta = skillMeta(o.item.skill, { bonus: techBonus(o.item.id) });
    const ch = [];
    if (!o.readTried) {
      const rdc = (o.type.key === "dangerous" ? 13 : 11) + Math.floor(o.tier / 2);
      const im = skillMeta("insight", { bonus: readBonus() });
      ch.push({ label: "Size them up", hint: "Insight · reveals what kind of client this is", odds: odds(im, rdc), action: () => {
        o.readTried = true;
        if (check(im, rdc).success) o.revealed = true;
        this.showOffer();
      } });
    }
    if (!o.drinkOffered) {
      ch.push({ label: "Pour them a drink", hint: "Lowers their guard · stress −1/round during the encounter", action: () => {
        o.drinkOffered = true; o.drinkAccepted = true;
        this.showOffer();
      } });
    } else if (o.drinkAccepted) {
      ch.push({ label: "Wine poured", hint: "They're warming up · stress −1/round", quiet: true, disabled: true });
    }
    ch.push({ section: "Terms" });
    const payHint = o.gross ? `~${o.gross} coin · ` : "";
    const drink = o.drinkAccepted || false;
    ch.push({ label: o.spec ? "Begin" : "Accept", hint: `${payHint}stress +${o.stress} · ${meta.label} per round${o.revealed ? "" : " · odds before reading"}`, odds: odds(meta, shownDC), primary: true,
      action: () => this.beginEncounter({ dc: realDC, gross: o.gross, stress: o.stress, drink }) });
    if (state.inspiration) {
      ch.push({ label: o.spec ? "Begin, inspired" : "Accept, inspired", hint: `${o.gross ? `~${o.gross + 4} coin · ` : ""}advantage on the first round · spends Inspiration`, odds: chanceOf(meta.bonus, shownDC, true, meta.dis), action: () => this.beginEncounter({ dc: realDC, gross: o.gross ? o.gross + 4 : 0, stress: Math.max(1, o.stress - 2), inspiration: true, drink }) });
    }
    if (!o.spec) {
      if (state.control >= 60) {
        ch.push({ label: "Name your price", hint: `~${Math.round(o.gross * 1.3)} coin · harder to please · Control 60+`, odds: odds(meta, shownDC + 1),
          action: () => this.beginEncounter({ dc: realDC + 1, gross: Math.round(o.gross * 1.3), stress: o.stress + 1, drink }) });
      }
      const pm = skillMeta("persuasion");
      ch.push({ label: "Negotiate gentler terms", hint: `~${Math.floor(o.gross * 0.65)} coin · success: easier and calmer`, odds: odds(pm, realDC), action: () => {
        const r = check(pm, realDC);
        const g = Math.floor(o.gross * 0.65);

      } });
      if (state.classFeatures.command && isKink(o.item.id)) {

      }
      const free = state.control >= 60 || isLimit;
      ch.push({ label: isLimit ? "Refuse: it's one of your limits" : "Turn them away", hint: free ? (isLimit ? "No penalty" : "On your own terms · no penalty (Control 60+)") : "−1 standing · −1 reputation · −2 control", quiet: !isLimit, primary: isLimit, action: () => {

    } else {

    }
    UI.choices(ch);
  },

  beginEncounter(t) {
    const o = this.offer;
    this.lastRoll = this.lastRoll && t.note ? this.lastRoll : null;
    let max = 12 + o.item.risk * 4 + o.tier + o.type.climax;
    if (!o.party) {
      if (bodyMatch(o.prefs.body) > 0) max = Math.round(max * 0.85);
      if (bodyMatch(o.prefs.body) < 0) max = Math.round(max * 1.15);
      if (o.prefs.likes.includes(o.item.id)) max = Math.max(8, max - 4);
      if (o.prefs.dislikes.includes(o.item.id)) max += 5;
    }
    let adv = state.classFeatures.showstopper ? 1 : 0;
    if (t.inspiration && state.inspiration) { state.inspiration = 0; adv += 1; }
    state.stress = clamp(state.stress + t.stress, 0, 100);
    const party = o.party ? o.party.map(m => {
      let mx = Math.round(max * 0.75);
      if (m.prefs.likes.includes(o.item.id)) mx -= 3;
      if (m.prefs.dislikes.includes(o.item.id)) mx += 4;
      if (bodyMatch(m.prefs.body) > 0) mx = Math.round(mx * 0.85);
      if (bodyMatch(m.prefs.body) < 0) mx = Math.round(mx * 1.15);
      return { ...m, max: mx, climax: mx, dress: 2 };
    }) : null;
    const rounds = 5 + (state.classFeatures.insatiable ? 1 : 0) + (party ? party.length - 1 + (state.classFeatures.ringmaster ? 1 : 0) : 0);
    state.encounter = {
      item: o.item, skill: o.item.skill, ctx: narrKey(o.tier), tier: o.tier, prefs: o.prefs, type: o.type, typeKey: o.type.key, revealed: o.revealed,
      patron: o.patron, npc: o.npc, cg: o.cg, who: this.whoOf(o), spec: o.spec, couple: o.couple || null, curMove: o.item, dc: t.dc, gross: t.gross,
      climax: max, climaxMax: max, round: 1, maxRounds: rounds, party, focus: 0, unlocks: [],
      dress: isKink(o.item.id) ? 1 : 2, selfDress: 2,
      arousal: 0,
      drinkActive: !!t.drink,
      advantageRounds: adv, lastMoveId: null, repeat: 0, combo: 0,
      text: t.note || (t.drink ? "You've had a glass together. The room is warmer already." : "You take them to bed.")
    };
    this.offer = null;
    const en = state.encounter;
    if (party) syncFocus(en);
    if (Narrator.on()) en.text = (t.note ? t.note + " " : "") + Narrator.open(en);

  planAction(kind, pos) {
    const e = state.encounter;
    const p = { kind, pos, skill: pos.skill, dcMod: 0, dmg: 3 + (pos.risk || 1), stress: 2, energy: 6, moveId: pos.id };
    if (kind === "tease") { Object.assign(p, { skill: "performance", dcMod: -2, dmg: 2, stress: 1, moveId: "tease" }); }
    else if (kind === "focus") { Object.assign(p, { dcMod: 2, dmg: 4 + (pos.risk || 1), stress: 3, energy: 8 }); }
    else if (kind === "recover") { Object.assign(p, { skill: "insight", dcMod: -1, dmg: 1, stress: state.classFeatures.soothing ? -4 : -2, energy: 3, moveId: "recover" }); }
    else if (kind === "command") { Object.assign(p, { skill: "kink", dcMod: 1, dmg: 4 + (pos.risk || 1), stress: 2, moveId: "command" }); }
    else if (kind === "together") { Object.assign(p, { skill: "performance", dcMod: 0, dmg: 3 + (pos.risk || 1), stress: 3, energy: 8, moveId: "together" }); }
    else if (kind === "undress") { Object.assign(p, { skill: "performance", dcMod: -1, dmg: 2, stress: 1, energy: 4, moveId: "undress" }); }
    else if (kind === "rush") { Object.assign(p, { skill: "manual", dcMod: -2, dmg: 1, stress: 1, energy: 3, moveId: "rush" }); }
    else if (kind === "strip") { Object.assign(p, { skill: "performance", dcMod: 0, dmg: 3, stress: 1, energy: 4, moveId: "strip" }); }
    else {
      const preferred = [...(CLASS_POSITIONS[state.character.class] || []), ...(SUBCLASS_POSITIONS[state.character.subclass] || [])];
      if (preferred.includes(pos.id)) p.dmg += 1;
    }
    if (state.classFeatures.frail) p.energy += 2;
    if (state.classFeatures.tireless) p.energy = Math.max(2, p.energy - 1);
    if (state.classFeatures.ironHips && p.skill === "vaginal") p.energy = Math.max(2, p.energy - 2);
    if (state.classFeatures.slender && (p.skill === "oral" || p.skill === "manual")) p.energy = Math.max(2, p.energy - 1);
    if ((kind === "work" || kind === "focus") && isPosition(pos.id) && e.dress) p.dmg = Math.max(1, p.dmg - e.dress);
    p.repeat = kind !== "recover" && p.moveId === e.lastMoveId ? e.repeat + 1 : 0;
    if (p.repeat) p.dmg = Math.max(1, p.dmg - 2 * p.repeat);
    p.dc = Math.max(6, e.dc + p.dcMod);
    let bonus = (kind === "work" || kind === "focus") ? techBonus(pos.id) : 0;
    if (state.classFeatures.freckles && e.typeKey === "nervous") bonus += 1;
    p.meta = skillMeta(p.skill, { advantage: e.advantageRounds > 0, bonus });
    p.odds = odds(p.meta, p.dc);
    return p;
  },

    const opt = (kind, pos, label, extra) => {

        if (e.prefs.likes.includes(pos.id)) notes.push(e.party ? `${e.npc.name} loves this` : "they love this");

      if (e.dress) {

    UI.choices(list);
  },

  doRound(kind, pos) {
    const e = state.encounter;
    if (!e) { this.menu(); return; }
    const p = this.planAction(kind, pos);
    if (state.energy < p.energy) { e.text = "You're too spent to go on."; this.finishEncounter(false); return; }
    state.energy -= p.energy;
    if (e.advantageRounds > 0) e.advantageRounds--;

      if (p.moveId !== e.lastMoveId && kind !== "recover") e.combo = Math.min(3, e.combo + 1);

  finishEncounter(success) {
    const e = state.encounter;
    state.encounter = null;
    if (!e) { this.menu(); return; }
    const risk = e.item.risk || 1;
    let partial = 0;
    if (e.party && !success) {
      const done = e.party.filter(m => m.climax <= 0).length;
      if (done) partial = done / e.party.length;
    }
    let gross = 0;
    if (e.gross) gross = success ? (e.gross + 4 + risk * 2) * e.type.payMult : partial ? e.gross * partial * e.type.payMult : e.gross * 0.45;
    const tip = success && e.type.tip ? Math.floor(gross * e.type.tip) : 0;
    const coin = e.gross ? Math.max(2, Math.floor(gross + tip)) : 0;
    const r = { success, coin, tip, partial };
    if (!(e.spec && e.spec.noTrouble)) {
      let chance = city().trouble + e.type.trouble + (state.phaseMods.trouble || 0) + (e.party ? 0.02 : 0);
      if (getFameIndex() >= 3) chance += 0.03;
      if (state.classFeatures.streetSmart) chance -= 0.03;
      if (state.classFeatures.marked) chance += 0.04;
      if (state.upgrades.better_locks) chance -= 0.10;
      if (Math.random() < chance) { this.trouble(e, r); return; }
    }
    this.applyResult(e, r);
