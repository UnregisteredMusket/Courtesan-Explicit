          else after(hurt("You can't get loose in time. It ends badly."), c);
        } },
        { label: "Talk them down", hint: "Persuasion · fail: hurt, lose half pay", odds: odds(pm, pdc), action: () => {
          const c = check(pm, pdc);
          if (c.success) { state.stress = clamp(state.stress + 3, 0, 100); after("Your voice stays level. The fire goes out of them.", c); }
          else after(hurt("Your words only make it worse."), c);
        } },
        house ? { label: "Shout for the doorman", hint: "Safe · 25% fee", action: () => { state.health = Math.max(0, state.health - hurtAmt(3)); r.coin = Math.floor(r.coin * 0.75); after("Boots on the stairs. The client is thrown out — after paying, minus the doorman's share."); } } : null,
        { label: "Endure it", hint: "Keep your pay · −10 health · +3 trauma", quiet: true, action: () => { state.health = Math.max(0, state.health - hurtAmt(10)); state.trauma = Math.min(100, state.trauma + 3); after("You go somewhere else in your head and let them take what they want. When it's done, they drop the coin on the bed and leave."); } }
      ]);
    }
  },

  applyResult(e, r, troubleText, troubleRoll) {
    const risk = e.item.risk || 1;
    const trial = e.spec && e.spec.trial;
    const size = e.party ? e.party.length : 1;
    const lines = [];
    if (troubleText) lines.push(troubleText);
    let rep = 0, standing = 0, trauma = 0;
    if (r.success) {
      rep = 2 + (state.classFeatures.naturalCharm ? 1 : 0) + (e.patron ? 1 : 0) + (size - 1);
      standing = 2 + e.tier + (e.patron ? 2 : 0) + 2 * (size - 1);
      state.fame += (e.patron ? 6 : 3) + 2 * (size - 1);
      let cg = 3 + getMod(state.attributes.cha);
      if (state.classFeatures.cravesIntensity && !isKink(e.item.id)) cg = Math.floor(cg / 2);
      state.control = clamp(state.control + cg, 0, 100);
      if (e.prefs.likes.includes(e.item.id) && !state.inspiration) { state.inspiration = 1; lines.push("They were delighted. You feel inspired."); }
    } else if (r.partial) {
      rep = 0; standing = 0;
      state.fame += 1;
    } else {
      rep = -2;
      standing = -(2 + e.tier);
      trauma = state.classFeatures.resilientMind ? Math.max(0, risk - 1) : risk;
      if (state.classFeatures.haunted) trauma += 1;
      state.control = Math.max(0, state.control - 5);
      state.health = Math.max(0, state.health - hurtAmt(risk * 3, true));
    }
    if (state.classFeatures.badRep) rep -= 1;
    state.coin += r.coin;
    state.reputation = Math.max(0, state.reputation + rep);
    if (!trial) standing = changeStanding(standing);
    state.trauma = Math.min(100, state.trauma + trauma);
    state.stats.coinEarned += r.coin;
    state.stats.encounters++;
    const satisfied = r.success || r.partial >= 0.5;
    if (satisfied) state.stats.successes++; else state.stats.failures++;
    if (e.party) state.stats.groups = (state.stats.groups || 0) + 1;
    const kind = e.item.skill || "performance";
    state.stats.byType[kind] = (state.stats.byType[kind] || 0) + 1;
    state.stats.played = state.stats.played || {};
    state.stats.played[e.item.id] = (state.stats.played[e.item.id] || 0) + 1;
    if (!trial) lines.push(...this.contractTick("tech", e.item.id, satisfied));
    state.skills[kind] = Math.min(100, (state.skills[kind] || 0) + (r.success ? 3 : 1));
    e.unlocks.push(...checkUnlocks());
    if (r.success && learnPosition(e.item.id)) lines.push(`You've learned ${e.item.name}.`);
    if (e.unlocks.length) lines.push(`Your skill has grown: you can now use ${[...new Set(e.unlocks)].join(", ")}.`);
    state.clientsServed += size;
    state.stats.bodyCount = state.clientsServed;
    // --- client book affinity update ---
    if (!trial && !e.party) {
      const specN  = e.spec && e.spec.name;
      const specCg = e.spec && e.spec.cg ? e.spec.cg : e.cg;
      const specIt = e.spec && e.spec.item ? e.spec.item : (e.item ? e.item.id : null);
      if (specN) {
        const ck = e.spec.clientKey || cbKey(specN, specCg);
        const delta = r.success ? (e.prefs && e.prefs.likes && e.prefs.likes.includes(e.item.id) ? 4 : 2)
                    : r.partial ? 0 : -2;
        const entry = cbUpsert(ck, specN, specCg, specIt, delta);
        const lbl = cbAffinityLabel(entry.affinity);
        if (r.success && entry.encounters >= 2 && delta > 0) lines.push(`<em>${specN} seems ${lbl} — ${entry.encounters} visits.</em>`);
      } else if (e.npc && e.npc.name) {
        // named NPC client (non-spec)
        const ck2 = cbKey(e.npc.name, e.cg);
        const delta2 = r.success ? 2 : r.partial ? 0 : -2;
        cbUpsert(ck2, e.npc.name, e.cg, specIt, delta2);
      }
    }
    gainXp(r.success ? (18 + risk * 4 + e.tier * 4) * (1 + 0.5 * (size - 1)) : 8);
    lines.push(...checkLevelUp());
    if (state.energy <= 10 && state.exhaustion < 4) { state.exhaustion++; lines.push("You're running on fumes. Exhaustion sets in."); }
    if (e.npc && e.npc.id) adjustRel(e.npc.id, { love: r.success ? 3 : 0, lust: 2, trust: r.success ? 2 : -1 });
    if (!e.revealed) lines.push(`<em>Looking back, they were ${e.type.name.toLowerCase()}.</em>`);

    const pay = trial ? "" : r.coin ? `You earn <b>${r.coin}</b> coin${r.tip ? ` (including a ${r.tip} tip)` : ""}. ` : "You earn nothing. ";
    const sw = trial ? "" : ` · ${sign(standing)} standing`;
    lines.unshift(`${pay}${sign(rep)} reputation${sw}.`);
    if (!r.success && !r.partial && !trial) lines.push("<em>Word gets around that you couldn't satisfy them. The guild notices.</em>");
    if (r.partial) lines.push(`<em>${Math.round(r.partial * size)} of ${size} left satisfied.</em>`);
    if (!troubleText && Narrator.on()) { const fin = Narrator.finish(e, r.success, r.partial); if (fin) lines.unshift(fin + "\n"); }
    this.log(`${r.success ? "Satisfied" : r.partial ? "Partly satisfied" : "Unsatisfied"}: ${e.who}, ${r.coin} coin.`);
    this.lastRoll = null;
    const next = e.spec ? () => this.runHook(r.success) : () => this.menu();
    this.outcome(r.success ? (e.party ? "They all get what they came for" : "They get what they came for") : r.partial ? "Some get what they came for" : "They leave without finishing", lines.join("\n"), next, { kicker: e.item.name, roll: troubleRoll || null });
  },

  /* ---------- Contract board ---------- */
  refreshBoard(force) {
    const k = state.contracts;
    if (!force && k.city === state.city && state.day < k.refreshed + 2 && k.board.length) return;
    k.city = state.city; k.refreshed = state.day;
    k.board = [];
    const n = 3 + (city().tier >= 3 ? 1 : 0);
    for (let i = 0; i < n; i++) k.board.push(makeContract());
  },
  contractsHere() {
    return state.contracts.active.filter(k => k.kind !== "tally" && k.city === state.city);
  },
  board() {
    this.setMode("event");
    this.refreshBoard();
    const k = state.contracts, full = k.active.length >= maxContracts();
    UI.scene({ kicker: `${city().name} guildhouse`, title: "The contract board",
      body: `Folded notes and sealed requests are pinned three deep. Take a contract and the guild expects it done: fulfil it for coin and standing; let it lapse or fail it and your name suffers.

<em>${k.active.length} of ${maxContracts()} contracts taken. New postings every two days.</em>` });
    const ch = k.board.map(c => {
      const reward = `+${c.bonus} coin bonus · +${c.standing} standing${c.payMult ? ` · pays ×${c.payMult.toFixed(1)}` : ""}`;
      const it = c.item ? anyItem(c.item) : null;
      const note = it && isPosition(it.id) && !knows(it.id) ? " · new technique" : it && (state.character.specialties || []).includes(it.id) ? " · your specialty" : "";
      return { label: c.title, hint: `${c.short} — ${reward} · ${c.days} days${note}`, disabled: full, reason: `You already hold ${maxContracts()} contracts`, action: () => {
        c.deadline = state.day + c.days - 1;
        k.active.push(c);
        k.board = k.board.filter(x => x !== c);
        this.log(`Took a contract: ${c.title}.`);
        UI.toast("Contract taken");
        this.board();
      } };
    });
    if (!ch.length) ch.push({ label: "The board is bare", hint: "Check back in a day or two", disabled: true, reason: "Nothing posted" });
    k.active.forEach(c => ch.push({ label: `Abandon: ${c.title}`, hint: `Costs ${Math.ceil(c.standing / 2)} standing`, quiet: true, danger: true, action: () => {
      k.active = k.active.filter(x => x !== c); k.failed++;
      const sd = changeStanding(-Math.ceil(c.standing / 2));
      this.log(`Abandoned a contract: ${c.title} (${sign(sd)} standing).`);
      this.board();
    } }));
    ch.push({ label: "Back", quiet: true, action: () => this.menu() });
    UI.choices(ch);
  },
  contractReward(c) {
    state.contracts.active = state.contracts.active.filter(x => x !== c);
    state.contracts.done++;
    state.coin += c.bonus; state.stats.coinEarned += c.bonus;
    const sd = changeStanding(c.standing);
    state.reputation += 1 + Math.floor(c.tier / 2);
    state.fame += 1;
    this.log(`Fulfilled a contract: ${c.title}. +${c.bonus} coin.`);
    return `<b>Contract fulfilled.</b> The guild pays a bonus of ${c.bonus} coin · ${sign(sd)} standing.`;
  },
  contractBreak(c, why) {
    state.contracts.active = state.contracts.active.filter(x => x !== c);
    state.contracts.failed++;
    const sd = changeStanding(-Math.max(2, Math.ceil(c.standing * 0.75)));
    state.reputation = Math.max(0, state.reputation - 1);
    this.log(`Broke a contract: ${c.title} (${sign(sd)} standing).`);
    return `<b>Contract broken</b>${why ? ` — ${why}` : ""}. ${sign(sd)} standing.`;
  },
  contractTick(type, key, ok) {
    const out = [];
    if (!ok) return out;
    state.contracts.active.filter(c => c.kind === "tally" && type === "tech" && c.item === key).forEach(c => {
      c.have++;
      if (c.have >= c.need) out.push(this.contractReward(c));
      else out.push(`<em>Guild order progress: ${c.have}/${c.need} ${anyItem(c.item).name}.</em>`);
    });
    return out;
  },
  contractExpire() {
    const out = [];
    state.contracts.active.filter(c => c.deadline < state.day).forEach(c => out.push(this.contractBreak(c, `"${c.title}" lapsed`).replace(/<\/?b>/g, "")));
    return out;
  },
  fulfilContract(c) {
    if (c.kind === "court") {
      this.hook = win => {
        const line = win ? this.contractReward(c) : this.contractBreak(c, "they weren't charmed");
        this.outcome(win ? "Contract fulfilled" : "Contract failed", line, () => this.menu(), { kicker: "The contract board" });
      };
      this.startCourt({ venue: c.venue, name: c.name, cg: c.cg, dcMod: c.dcMod });
      return;
    }
    const why = whyCantWork();
    if (why) { UI.toast(why); return; }
    state.flags.clientsThisPhase++;
    this.hook = ok => {
      const line = ok ? this.contractReward(c) : this.contractBreak(c, "the client left unhappy");
      this.outcome(ok ? "Contract fulfilled" : "Contract failed", line, () => this.menu(), { kicker: "The contract board" });
    };
    const spec = { item: c.item, payMult: c.payMult, dcMod: c.dcMod };
    if (c.kind === "party") spec.group = c.size;
    else { spec.name = c.name; spec.cg = c.cg; spec.blurb = c.short.replace(/\.$/, "").replace(/^./, m => m.toLowerCase()); }
    this.startEncounter(spec);
  },

  /* ---------- Training at the guildhouse ---------- */
  train() {
    this.setMode("event");
    const c = city();
    const gain = 3 + Math.floor(c.tier / 2);
    const fee = sk => 6 + 4 * c.tier + Math.floor((state.skills[sk] || 0) / 10) * 2;
    UI.scene({ kicker: `${c.name} guildhouse`, title: "Training", body: `The guild's tutors here will drill you for a few hours. Better cities have better teachers.\n\n<em>Each lesson: +${gain} to a skill (or +8 mastery in a technique), −15 energy. Once per phase.</em>` });
    const ch = [{ section: "Skills" }, { grid: Object.keys(state.skills).map(sk => ({
      label: `${SKILL_LABEL[sk]} ${state.skills[sk]}`, hint: `→ ${Math.min(100, state.skills[sk] + gain)}${nextUnlock(sk) ? ` · next: ${nextUnlock(sk)}` : ""}`,
      price: String(fee(sk)), disabled: state.coin < fee(sk) || state.skills[sk] >= 100, reason: state.skills[sk] >= 100 ? "Mastered" : `Need ${fee(sk)} coin`,
      action: () => {
        state.coin -= fee(sk); state.energy = Math.max(0, state.energy - 15); state.flags.trainedThisPhase = true;
        state.skills[sk] = Math.min(100, state.skills[sk] + gain);
        gainXp(10 + 2 * c.tier);
        const un = checkUnlocks(); const lv = checkLevelUp();
        this.log(`Trained ${SKILL_LABEL[sk]} to ${state.skills[sk]}.`);
        this.outcome("A lesson well learned", `Hours of drills with a guild tutor. ${SKILL_LABEL[sk]} rises to ${state.skills[sk]}.${un.length ? `\n\n<b>Unlocked:</b> ${un.join(", ")}.` : ""}${lv.length ? "\n" + lv.join("\n") : ""}`, null, { kicker: "Training" });
      } })) }];
    const techs = [...state.knownPositions.filter(isPosition), ...knownKinks()];
    const tfee = 5 + 3 * c.tier;
    ch.push({ section: "Practice a technique" }, { grid: techs.map(id => ({
      label: nameOf(id), hint: `${MASTERY_NAMES[masteryTier(id)] || "Untrained"} · ${state.mastery[id] || 0}/${MASTERY_AT[3]}`, price: String(tfee),
      disabled: state.coin < tfee || (state.mastery[id] || 0) >= MASTERY_AT[3], reason: (state.mastery[id] || 0) >= MASTERY_AT[3] ? "Mastered" : `Need ${tfee} coin`,
      action: () => {
        state.coin -= tfee; state.energy = Math.max(0, state.energy - 15); state.flags.trainedThisPhase = true;
        const before = masteryTier(id);
        state.mastery[id] = Math.min(MASTERY_AT[3], (state.mastery[id] || 0) + 8);
        const after = masteryTier(id);
        gainXp(8 + 2 * c.tier); const lv = checkLevelUp();
        this.outcome("Practice", `You rehearse ${nameOf(id)} until it's second nature.${after > before ? `\n\n<b>You are now ${MASTERY_NAMES[after].toLowerCase()} at ${nameOf(id)}</b> (+${after} to its checks).` : ""}${lv.length ? "\n" + lv.join("\n") : ""}`, null, { kicker: "Training" });
      } })) });
    ch.push({ label: "Not now", quiet: true, action: () => this.menu() });
    UI.choices(ch);
  },

  /* ---------- Courtship ---------- */
  // spec: { venue, name, cg, pers, dcMod, rounds, bonus, free, trial }
  startCourt(spec) {
    const v = VENUES[spec.venue];
    if (!spec.free) {
      if (state.flags.courtedThisPhase || state.energy < 10) { UI.toast("Not now."); this.menu(); return; }
      state.flags.courtedThisPhase = true;
      state.energy -= 10;
    }
    const cg = spec.cg || clientGender();
    const name = spec.name || `${pick(v.titles[cg])} ${pick(SURNAMES)}`;
    const tierBump = Math.max(0, city().tier - (spec.venue === "tavern" ? 0 : spec.venue === "salon" ? 2 : 4));
    let dc = v.dc + tierBump + (spec.dcMod || 0);
    if (state.classFeatures.courtlyGrace) dc -= 1;
    if (state.classFeatures.shyCrowds && spec.venue === "court") dc += 2;
    if (!spec.trial) {
      const fatigue = societyFatigue();
      dc += 2 * fatigue;
      const log = state.courtLog[state.city] || (state.courtLog[state.city] = []);
      log.push(state.day);
      state.courtLog[state.city] = log.filter(d => d >= state.day - 2);
    }
    let interest = 30 + Math.min(15, Math.floor(state.reputation / 20)) + (state.upgrades.finery ? 10 : 0) + (spec.bonus || 0);
    if (state.classFeatures.beautyMark) interest += 5;
    if (state.classFeatures.tattoo && spec.venue !== "tavern") interest -= 5;
    const body = spec.trial ? null : rollBodyPref();
    interest += 10 * bodyMatch(body);
    state.court = {
      venue: spec.venue, name, cg, pers: spec.pers || pick(Object.keys(PERSONALITIES)),
      interest: clamp(interest, 0, 95),
      round: 1, max: spec.rounds || 4, used: {}, revealed: false, readTried: false,
      dc, last: "", spec, said: {}, body
    };
    this.log(`Courted ${name} at ${v.where}.`);
    this.lastRoll = null;
    this.courtRound();
  },

  courtRound() {
    const c = state.court;
    if (!c) { this.menu(); return; }
    if (c.interest >= 100 || c.interest <= 0 || c.round > c.max) { this.finishCourt(); return; }
    this.setMode("encounter");
    const P = PERSONALITIES[c.pers];
    const v = VENUES[c.venue];
    const chips = [];
    if (c.revealed) {
      chips.push({ text: `${P.name}: ${P.desc}`, cls: "calm" });
      P.favors.forEach(t => chips.push({ text: "♥ " + TONES[t].name, cls: "like" }));
      chips.push({ text: "✕ " + TONES[P.hates].name, cls: "dislike" });
    }
    UI.scene({
      kicker: `${c.spec.trial ? "Rank trial · " : ""}${cap(v.where)} · exchange ${c.round} of ${c.max}`,
      title: c.name,
      speech: P.prompts[(c.round - 1) % P.prompts.length],
      body: c.last || `<em>You catch ${c.name}'s eye across the room and make your way over.${c.body ? ` ${cap(Narrator.fill("{they}", courtTarget(c)))} ${bodyPrefText(c.body)}${bodyMatch(c.body) > 0 ? ", and you can see it working in your favor." : bodyMatch(c.body) < 0 ? ". You are not what they had in mind." : "."}` : ""}</em>`,
      meter: { label: "Interest", value: c.interest, color: "var(--c-rep)", pips: { max: c.max, used: c.round - 1 } },
      roll: this.lastRoll, chips
    });
    const ch = [];
    if (!c.readTried) {
      const im = skillMeta("insight", { bonus: readBonus() });
      const rdc = c.dc - 1;
      ch.push({ label: "Read them first", hint: "Insight · learn what they respond to · doesn't use an exchange", odds: odds(im, rdc), action: () => {
        c.readTried = true;
        if (check(im, rdc).success) c.revealed = true;
        this.courtRound();
      } });
    }
    ch.push({ section: "Your reply" });
    Object.keys(TONES).forEach(t => {
      const T = TONES[t];
      const used = c.used[t] || 0;
      const dc = c.dc + 2 * used;
      const meta = toneMeta(t);
      c.said[t] = T.lines[(c.round + Object.keys(TONES).indexOf(t)) % T.lines.length];
      const notes = [c.said[t]];
      if (c.revealed) notes.push(P.favors.includes(t) ? "they'll love this" : P.hates === t ? "they hate this" : "neutral");
      if (used) notes.push("repeating — harder");
      notes.push(T.attr ? T.attr.toUpperCase() : `${SKILL_LABEL[T.skill]} (${SKILL_ATTR[T.skill].toUpperCase()})`);
      ch.push({ label: T.name, hint: notes.join(" · "), odds: odds(meta, dc), action: () => this.courtReply(t) });
    });
    ch.push({ label: "Make your excuses", hint: c.interest >= 40 ? "Leave on good terms" : "Leaving now will look like a snub", quiet: true, action: () => this.finishCourt(true) });
    UI.choices(ch);
  },

  courtReply(t) {
    const c = state.court;
    const P = PERSONALITIES[c.pers];
    const used = c.used[t] || 0;
    const dc = c.dc + 2 * used;
    c.used[t] = used + 1;
    const r = check(toneMeta(t), dc);
    const fav = P.favors.includes(t), hate = P.hates === t;
    let d, key;
    if (hate) { d = r.success ? -15 : -25; key = "hated"; }
    else if (r.success) { d = fav ? 20 + 3 * Math.floor((r.total - dc) / 3) : 10; key = fav ? "great" : "fine"; }
    else { d = -10; key = "poor"; }
    c.interest = clamp(c.interest + d, 0, 100);
    let st = r.success ? 0 : 2;
    if (st && state.classFeatures.unflappable) st -= 1;
    state.stress = clamp(state.stress + st, 0, 100);
    const reaction = Narrator.fill(pick(COURT_REACTIONS[key]), courtTarget(c));
    c.last = `You: <em>${c.said[t]}</em>\n${reaction}`;
    c.round++;
    this.courtRound();
  },

  finishCourt(early) {
    const c = state.court;
    state.court = null;
    if (!c) { this.menu(); return; }
    const v = VENUES[c.venue];
    const s = v.scale;
    const win = c.interest >= 65;
    const lose = c.interest < 40;
    state.stats.courtships++;
    if (win) state.stats.courtWins++;
    const lvl = c.spec.trial ? [] : this.contractTick("court", c.venue, win);
    gainXp(win ? 15 + 5 * s : 5);
    lvl.push(...checkLevelUp());
    this.lastRoll = null;
    const tgt = courtTarget(c);
    const they = Narrator.fill("{they}", tgt), their = Narrator.fill("{their}", tgt);

    if (c.spec.trial || this.hook) {
      const text = win ? `${c.name} rises, satisfied. You've done what was asked of you.` : `${c.name} thanks you coolly and turns away. It wasn't enough.`;
      this.outcome(win ? "You win them over" : "You fail to win them over", text + (lvl.length ? "\n\n" + lvl.join("\n") : ""), () => this.runHook(win), { kicker: `Interest ${c.interest}` });
      return;
    }
    if (win) {
      const st = changeStanding(1 + s);
      state.fame += s + 1;
      state.reputation += s;
      this.setMode("event");
      UI.scene({ kicker: `Interest ${c.interest}`, title: `${c.name} is charmed`,
        body: `By the end of the evening ${they} have their hand on your thigh and ${their} mouth close to your ear, making ${their} intentions clear.\n\n<em>${sign(st)} standing · +${s + 1} fame · +${s} reputation</em>${lvl.length ? "\n" + lvl.join("\n") : ""}` });
      const tierPay = (10 + 8 * city().tier) * s;
      UI.choices([
        { label: `Go to ${their} chambers and fuck`, hint: "A private engagement that pays very well", primary: true,
          disabled: state.energy < 15 || state.health < MIN_HEALTH_TO_WORK, reason: "Too tired or hurt tonight",
          action: () => this.startEncounter({ name: c.name, cg: c.cg, typeKey: pick(["generous", "demanding", "ordinary"]), payMult: 1 + 0.5 * s, patron: true }) },
        { label: "Seek their patronage instead", hint: `A gift of about ${tierPay} coin`, action: () => {
          state.coin += tierPay; state.stats.coinEarned += tierPay;
          this.outcome("A new patron", `${c.name} presses a purse into your hand and promises to speak well of you.\n\n<em>+${tierPay} coin</em>`, null);
        } }
      ]);
      return;
    }
    if (lose) {
      const loss = state.classFeatures.salonLion ? 0 : -(1 + 2 * s) - (state.classFeatures.gossipMagnet ? 2 : 0);
      const st = changeStanding(loss);
      state.reputation = Math.max(0, state.reputation - 2 * s);
      state.control = Math.max(0, state.control - 3);
      this.outcome("A public snub", `${c.name} turns ${their} back on you mid-sentence. Half the room saw it.\n\n<em>${sign(st)} standing · −${2 * s} reputation</em>${lvl.length ? "\n" + lvl.join("\n") : ""}`, null, { kicker: `Interest ${c.interest}` });
      return;
    }
    this.outcome(early ? "You take your leave" : "A pleasant evening", `${c.name} enjoyed the conversation, but nothing more will come of it tonight.${lvl.length ? "\n\n" + lvl.join("\n") : ""}`, null, { kicker: `Interest ${c.interest}` });
  },

  /* ---------- Rank trials ---------- */
  startTrial() {
    if (!trialReady() || state.flags.trialDay === state.day) { this.menu(); return; }
    state.flags.trialDay = state.day;
    const target = state.rank + 1;
    const R = RANKS[target];
    const cg = clientGender();
    const examiner = `${cg === "male" ? pick(["Examiner Halvard", "Examiner Benedek", "Examiner Corin"]) : pick(["Examiner Ottoline", "Examiner Isaura", "Examiner Maude"])}`;
    const venue = target >= 4 ? "court" : target >= 2 ? "salon" : "tavern";
    const item = pick([...city().tastes.filter(id => isKink(id) || state.knownPositions.includes(id)), ...state.knownPositions.filter(isPosition)]);
    const encSpec = { trial: true, name: examiner, cg, blurb: "an examiner of the Courtesan's Guild, notebook in hand", typeKey: "demanding", item, dcMod: 1 + Math.floor(target / 2), payMult: 0, noTrouble: true };
    const courtSpec = { trial: true, venue, name: "an envoy of the Guild Council", cg, dcMod: 1 + Math.floor(target / 2), free: true };
    this.log(`Faced the trial for ${R.name}.`);
    if (R.trial === "final") {
      const favor = state.story.councilFavor ? -2 : 0;
      this.outcome("The Guild Council", `The council chamber is cold marble and colder eyes. Seven masters of the guild will judge you twice: first in conversation, then in practice.${favor ? "\n\n<em>Your friends on the council have softened the room.</em>" : ""}`, () => {
        this.hook = ok => {
          if (!ok) { this.trialResult(false); return; }
          this.outcome("The second test", "The council murmurs. You have their attention; now you must prove your craft.", () => {
            this.hook = ok2 => ok2 ? this.ending("guildmaster") : this.trialResult(false);
            this.startEncounter({ ...encSpec, name: "the Council's chosen examiner", dcMod: 4 + favor });
          });
        };
        this.startCourt({ ...courtSpec, venue: "court", name: "the Guild Council", rounds: 5, dcMod: 3 + favor });
      }, { kicker: "Final trial" });
      return;
    }
    const kind = R.trial === "court" ? "a courtship before the council's envoy" : "a private engagement observed by the guild's examiners";
    this.outcome(`The trial for ${R.name}`, `The guildhouse clears a room for you. Your trial is ${kind}. Satisfy them, and you rise. Fail, and the guild will remember.`, () => {
      this.hook = ok => this.trialResult(ok);
      if (R.trial === "court") this.startCourt(courtSpec);
      else this.startEncounter(encSpec);
    }, { kicker: "Rank trial" });
  },

  trialResult(success) {
    if (success) {
      state.rank++;
      const R = RANKS[state.rank];
      state.coin += R.purse;
      state.stats.coinEarned += R.purse;
      state.pendingLevelUps++;
      gainXp(40 + 10 * state.rank);
      const lv = checkLevelUp();
      this.log(`Promoted to ${R.name}.`);
      const opens = CITIES.find(c => c.rank === state.rank);
      const venues = Object.keys(VENUES).filter(k => VENUES[k].rank === state.rank).map(k => VENUES[k].where);
      this.outcome(`${R.name} of the Guild`, `The examiners set down their pens. You are ${an(R.name)} ${R.name} of the Courtesan's Guild.\n\n<em>${R.purse ? `+${R.purse} coin · ` : ""}an attribute increase${opens ? ` · ${opens.name} is now open to you` : ""}${venues.length ? ` · you may now attend ${venues.join(" and ")}` : ""}</em>${lv.length ? "\n" + lv.join("\n") : ""}`, null, { kicker: "Promotion" });
    } else {
      const st = changeStanding(-10);
      state.reputation = Math.max(0, state.reputation - 3);
      this.outcome("The examiners are unmoved", `They make a note and dismiss you. You may try again another day.\n\n<em>${sign(st)} standing · −3 reputation</em>`, null, { kicker: "Trial failed" });
    }
  },

  /* ---------- Scripted scenes ---------- */
  // scene: { title, kicker, nodes: { id: { title?, text, choices: [{ label, hint, check: {skill|attr|tone, dc}, ok, fail, go, cost }] } } }
  // Node ids starting with "#" call handlers: #win, #lose, #retry.
  runScene(sc, id, h) {
    if (id.charAt(0) === "#") { const f = h[id.slice(1)]; if (f) f(); else this.menu(); return; }
    const node = sc.nodes[id];
    this.setMode("event");
    UI.scene({ kicker: node.kicker || sc.kicker, title: node.title || sc.title, body: fillText(node.text), roll: this.lastRoll });
    UI.choices(node.choices.map(ch => {
      const cost = ch.cost || 0;
      const c = { label: ch.label, hint: ch.hint || "", price: cost ? String(cost) : "", disabled: cost > 0 && state.coin < cost, reason: `Need ${cost} coin` };
      if (ch.check) {
        const meta = metaFor({ ...ch.check, bonus: (ch.check.bonus || 0) + (ch.check.guard && state.upgrades.bodyguard ? 2 : 0) });
        c.odds = odds(meta, ch.check.dc);
        c.hint = [ch.hint, meta.label].filter(Boolean).join(" · ");
        c.action = () => { const r = check(meta, ch.check.dc); this.runScene(sc, r.success ? ch.ok : ch.fail, h); };
      } else {
        c.action = () => { if (cost) state.coin -= cost; this.lastRoll = null; this.runScene(sc, ch.go, h); };
      }
      return c;
    }));
  },

  /* ---------- Quests ---------- */
  questsHere() { return QUESTS.filter(q => q.city === state.city && state.rank >= q.minRank && !state.quests[q.id]); },

  askAround() {
    const qs = this.questsHere();
    this.setMode("event");
    UI.scene({ kicker: `${city().name} guildhouse`, title: "Asking around", body: "Over watered wine and gossip, a few people mention they could use someone with your talents." });
    UI.choices([
      ...qs.map(q => ({ label: q.title, hint: q.giver, action: () => {
        state.quests[q.id] = { step: 0, status: "active" };
        this.log(`Took on a quest: ${q.title}.`);
        this.outcome(q.title, `${fillText(q.intro)}\n\n<em>Next: ${q.steps[0].desc}</em>`, null, { kicker: "New quest" });
      } })),
      { label: "Not now", quiet: true, action: () => this.menu() }
    ]);
  },

  questStep(q) {
    const st = state.quests[q.id];
    const step = q.steps[st.step];
    const done = ok => this.questProgress(q, ok);
    this.lastRoll = null;
    if (step.type === "scene") {
      this.runScene({ title: q.title, kicker: "Quest", nodes: step.nodes }, "start", {
        win: () => done(true), lose: () => done(false),
        retry: () => { state.flags.questTried[q.id] = state.day; this.outcome(q.title, step.retryText || "Nothing more can be done today. You'll have to try again tomorrow.", null, { kicker: "Quest" }); }
      });
    } else if (step.type === "encounter") {
      this.hook = done;
      this.startEncounter({ ...step.spec });
    } else if (step.type === "court") {
      this.hook = done;
      this.startCourt({ ...step.spec, free: true });
    }
  },

  questProgress(q, ok) {
    const st = state.quests[q.id];
    if (!ok) {
      st.status = "failed";
      const sd = changeStanding(-5);
      state.reputation = Math.max(0, state.reputation - 3);
      this.log(`Failed a quest: ${q.title}.`);
      this.outcome(`Quest failed: ${q.title}`, `${fillText(q.failText)}\n\n<em>${sign(sd)} standing · −3 reputation</em>`, null, { kicker: "Quest" });
      return;
    }
    if (st.step + 1 < q.steps.length) {
      const prev = q.steps[st.step];
      st.step++;
      this.outcome(q.title, `${fillText(prev.doneText || "One step closer.")}\n\n<em>Next: ${q.steps[st.step].desc}</em>`, null, { kicker: "Quest" });
      return;
    }
    st.status = "done";
    state.stats.questsDone++;
    const R = q.reward;
    const got = [];
    if (R.coin) { state.coin += R.coin; state.stats.coinEarned += R.coin; got.push(`+${R.coin} coin`); }
    if (R.standing) got.push(`${sign(changeStanding(R.standing))} standing`);
    if (R.fame) { state.fame += R.fame; got.push(`+${R.fame} fame`); }
    if (R.rep) { state.reputation += R.rep; got.push(`+${R.rep} reputation`); }
    if (R.xp) { gainXp(R.xp); got.push(`+${R.xp} XP`); }
    if (R.rel) Object.keys(R.rel).forEach(id => adjustRel(id, R.rel[id]));
    if (R.flag) state.story[R.flag] = true;
    if (R.learn) { const l = grantClassPositions(1); if (l.length) got.push(`learned ${l[0]}`); }
    const lv = checkLevelUp();
    this.log(`Completed a quest: ${q.title}.`);
    this.outcome(`Quest complete: ${q.title}`, `${fillText(R.text)}\n\n<em>${got.join(" · ")}</em>${lv.length ? "\n" + lv.join("\n") : ""}`, null, { kicker: "Quest" });
  },

  /* ---------- Breakdown & endings ---------- */
  breakdown() {
    const bt = state.classFeatures.steadyNerves ? 3 : 5, bc = state.classFeatures.steadyNerves ? 5 : 10;
    state.trauma = Math.min(100, state.trauma + bt);
    state.stress = 60;
    state.control = Math.max(0, state.control - bc);
    state.health = Math.max(0, state.health - 5);
    const sd = changeStanding(-3);
    this.log("Broke down under the strain.");
    const newDay = this.advanceClock();
    this.outcome("You break down", `The weight of it all lands at once. You lose the rest of the ${newDay ? "night" : "day's phase"} shaking in your room, unable to face anyone. The guildhouse notices.\n\n<em>+${bt} trauma · −${bc} control · ${sign(sd)} standing. Stress settles at 60.</em>`, () => newDay ? this.dawnReport() : this.menu(), { kicker: "Stress 100" });
  },

  checkForcedEnding() {
    if (state.ended) { this.ending(state.ended); return true; }
    if (state.trauma >= 100 || state.health <= 0) { this.ending("burnout"); return true; }
    return false;
  },

  ending(key) {
    state.ended = key;
    this.setMode("ending");
    if (state.ironman) { try { localStorage.removeItem("courtesan-v4"); } catch (e) { /* ignore */ } }
    const s = state.stats;
    const end = ENDINGS[key];
    const endTitle = typeof end.title === "function" ? end.title() : end.title;
    const mot = MOTIVES[state.character.motivation];
    const motLine = mot ? `\n\n<em>${mot.done(key) ? mot.doneText : mot.failText}</em>` : "";
    const lose = key === "expelled" || key === "burnout";
    this.log(`Ending: ${endTitle}.`);
    UI.scene({
      kicker: `${lose ? "Game over" : "The End"} · ${esc(state.character.name || "")}`, title: endTitle,
      body: `${end.text}${motLine}\n\n<em>${rankName()} · ${s.daysPlayed} days · ${Object.keys(state.visited || {}).length} cities · ${s.bodyCount} clients · ${s.courtWins} courtships won · ${s.questsDone} quests · level ${state.level} · ${getFameTier(state.fame).name}</em>`,
      chips: [{ text: `${classLabel(state.character.class)} · ${state.character.subclass || ""}`, cls: "gold" }, state.ironman ? { text: "Ironman", cls: "warn" } : null].filter(Boolean)
    });
    UI.choices([
      { label: "Begin a new life", primary: true, action: () => this.newGame() },
      { label: "Load your last save", disabled: state.ironman || !this.hasSave(), reason: state.ironman ? "Ironman: this life is over" : "No save", action: () => this.load() }
    ]);
  },

  /* ---------- Story ---------- */
  checkStory() {
    const st = state.story;
    const briar = rel("briar"), edric = rel("edric"), marlow = rel("marlow");
    const name = pname();
    if (!st.briarMentor && briar.trust >= 6) {
      st.briarMentor = true;
      state.skills.persuasion += 6; state.skills.insight += 4;
      const learned = grantClassPositions(1);
      this.log("Madam Briar took you under her wing.");
      this.outcome("Madam Briar's lesson", `Briar pours two glasses and talks for an hour: which clients lie about their purses, how to end a bad night early, how the guild's examiners think. "You've got a head on you, ${name}," she says. "Don't waste it."\n\n<em>+6 Persuasion · +4 Insight${learned.length ? " · learned " + learned.join(", ") : ""}</em>`, null, { kicker: "A mentor" });
      return true;
    }
    if (!st.edric && edric.love >= 18 && edric.trust >= 12 && state.rank >= 3 && city().tier >= 2) {
      st.edric = "asked";
      this.log("Sir Edric made an offer.");
      this.runScene({ title: "Sir Edric's proposal", kicker: "An offer", nodes: {
        start: { text: `Sir Edric lingers after paying. "${name}," he says, "I have spoken to my steward. I would settle your contract with the guild and take you home to my estate." He hesitates. "My mother will have to approve. She approves of very little."`,
          choices: [
            { label: "Meet his mother", hint: "A hard courtship with a proud dowager. Win, and the game ends with Edric. Lose, and he withdraws for good.", go: "#win" },
            { label: "Decline gracefully", hint: "+5 control · he'll still visit", go: "#lose" }
          ] } } }, "start", {
        win: () => {
          this.hook = ok => {
            if (ok) { this.ending("kept"); return; }
            st.edric = "refused";
            adjustRel("edric", { love: -10 });
            const sd = changeStanding(-5);
            this.outcome("The dowager refuses", `"Absolutely not." Edric won't meet your eyes as his mother sweeps out. The offer is withdrawn, and the story is all over the salons by nightfall.\n\n<em>${sign(sd)} standing</em>`, null);
          };
          this.startCourt({ venue: "court", name: "the Dowager Lady Edric", cg: "female", pers: "proud", dcMod: 3, rounds: 5, free: true });
        },
        lose: () => { st.edric = "declined"; state.control = clamp(state.control + 5, 0, 100); this.outcome("You decline", "He takes it well, or pretends to. \"The offer stands,\" he says, though you both know it won't.", null); }
      });
      return true;
    }
    if (!st.marlow && marlow.love >= 15 && marlow.trust >= 8 && city().tier <= 1) {
      st.marlow = "asked";
      this.log("Marlow asked you to leave with him.");
      const fail = text => () => {
        const sd = changeStanding(-20);
        state.trauma = Math.min(100, state.trauma + 5);
        st.marlow = "failed";
        this.outcome("Caught", `${text} Marlow's ship sails without you.\n\n<em>${sign(sd)} standing · +5 trauma</em>`, null);
      };
      this.runScene({ title: "Marlow's plan", kicker: "A choice", nodes: {
        start: { text: `Marlow has saved enough for two berths on a ship sailing south at dawn. "Come with me, ${name}." But the guild doesn't let its own walk away.`,
          choices: [
            { label: "Buy out your contract and plead your case", hint: "Costs 300 coin, then win over the guild matron", cost: 300, go: "plead" },
            { label: "Slip away in the night", hint: "If you're caught, the guild will make an example of you", check: { attr: "dex", dc: 16 }, ok: "#win", fail: "#caught" },
            { label: "Stay", hint: "+3 control · it will sting", go: "#stay" }
          ] },
        plead: { text: "The guild matron counts your coin twice and folds her hands. \"Money is the easy part. Convince me you won't shame us out there.\"",
          choices: [{ label: "Make your case", check: { skill: "persuasion", dc: 15 }, ok: "#win", fail: "#refused" }] }
      } }, "start", {
        win: () => this.ending("runaway"),
        caught: fail("The guild's runners find you on the quay before first light."),
        refused: fail("\"No,\" she says, and keeps the coin as a fine besides."),
        stay: () => { st.marlow = "stayed"; state.control = clamp(state.control + 3, 0, 100); state.stress = clamp(state.stress + 8, 0, 100); adjustRel("marlow", { love: -5 }); this.outcome("You stay", "He nods like he expected it, and leaves the ticket on your pillow anyway.", null); }
      });
      return true;
    }
    return false;
  },

  /* ---------- Time ---------- */
  advanceClock() {
    state.flags.restedThisPhase = false;
    state.flags.clientsThisPhase = 0;
    state.flags.courtedThisPhase = false;
    state.flags.trainedThisPhase = false;
    state.flags.repeatClient = null;
    state.phaseMods = { payMult: 1, trouble: 0, extraClients: 0, label: "" };
    if (state.phase === "morning") { state.phase = "afternoon"; return false; }
    if (state.phase === "afternoon") { state.phase = "night"; return false; }
    this.newDay();
    return true;
  },

  dues() { return 10 + 10 * state.rank; },
  charge(amount) {
    if (state.coin >= amount) { state.coin -= amount; return true; }
    state.debt += amount - state.coin;
    state.coin = 0;
    return false;
  },

  newDay() {
    const L = [];
    state.day++;
    state.stats.daysPlayed = state.day;
    state.phase = "morning";
    state.energy = Math.min(100, state.energy + 30);
    state.health = Math.min(maxHealth(), state.health + 5);
    state.stress = Math.max(0, state.stress - 5);
    state.trauma = Math.max(0, state.trauma - 2);
    state.control = Math.min(100, state.control + 2);
    if (state.exhaustion) state.exhaustion--;
    if (state.debt > 0) {
      const int = Math.max(1, Math.ceil(state.debt * 0.05));
      state.debt += int;
      state.debtDays++;
      L.push(`Interest on your debt: +${int}.`);
    }
    const up = lodging();
    if (this.charge(up)) L.push(`Paid ${up} for lodging in ${city().name}.`);
    else { state.stress = Math.min(100, state.stress + 8); state.reputation = Math.max(0, state.reputation - 1); L.push(`Couldn't cover ${up} for lodging. The shortfall goes on your debt.`); }
    if (state.day % 7 === 0) {
      const d = this.dues();
      if (state.coin >= d) { state.coin -= d; L.push(`Paid ${d} in guild dues.`); }
      else { const sd = changeStanding(-8); L.push(`You couldn't pay your guild dues. The guild notes your arrears (${sign(sd)} standing).`); }
    }
    if (!state.debt) state.debtDays = 0;
    L.push(...this.contractExpire());
    this.dawnLines = L;
    this.log(`Dawn of day ${state.day}. ${L.join(" ")}`);
    this.save(false);
  },

  endPhase() {
    const newDay = this.advanceClock();
    if (newDay) { this.dawnReport(); return; }
    this.afterPhase();
  },

  dawnReport(prefix) {
    const L = this.dawnLines || [];
    this.outcome(`Day ${state.day}`, (prefix ? prefix + "\n\n" : "") + (L.length ? L.join("\n") : "A quiet night.") + `\n\n<em>${state.ironman ? "Ironman: saved." : "The game has been saved."}</em>`, () => this.afterDawn(), { kicker: `Dawn in ${city().name}` });
  },

  afterDawn() {
    if (state.debt > 0 && state.debtDays >= 3) { this.creditor(); return; }
    this.afterPhase();
  },

  afterPhase() {
    if (!state.ended && state.classFeatures.gossipMagnet && state.rank >= 1 && Math.random() < 0.12) { EVENTS.find(x => x.id === "rumors").run(); return; }
    if (!state.ended && Math.random() < 0.3) {
      const pool = EVENTS.filter(ev => ev.when());
      if (pool.length) { pick(pool).run(); return; }
    }
    // Check for a returning client (named book entry OR mastery-based stranger)
    if (!state.ended && !state.flags.repeatClient) {
      const rc = genBookedReturn() || genRepeatClient();
      if (rc) state.flags.repeatClient = rc;
    }
    this.menu();
  },

  creditor() {
    this.setMode("event");
    this.log("A creditor came calling.");
    UI.scene({ kicker: `Debt ${state.debt}`, title: "A creditor at the door", body: "A broad man with a ledger and a cudgel leans in your doorway. \"You owe. My employer is losing patience.\"", chips: [{ text: `${state.debtDays} days overdue`, cls: "warn" }] });
    const pm = skillMeta("persuasion", { bonus: state.upgrades.bodyguard ? 2 : 0 }), dc = 12 + controlMod();
    const beaten = () => { state.health = Math.max(0, state.health - hurtAmt(20)); state.trauma = Math.min(100, state.trauma + 4); state.reputation = Math.max(0, state.reputation - 2); changeStanding(-3); state.debtDays = 0; };
    UI.choices([
      { label: "Pay what you can", hint: `Hand over ${Math.min(state.coin, state.debt)} coin`, disabled: state.coin < 1, reason: "You have nothing", action: () => {
        const amt = Math.min(state.coin, state.debt); state.coin -= amt; state.debt -= amt; state.debtDays = state.debt ? 1 : 0;
        this.outcome("Paid", `He counts it twice and leaves.${state.debt ? ` You still owe ${state.debt}.` : " You're clear."}`, null);
      } },
      { label: "Ask for more time", hint: "Persuasion · fail: a beating", odds: odds(pm, dc), action: () => {
        const r = check(pm, dc);
        if (r.success) { state.debtDays = 0; state.stress = clamp(state.stress + 3, 0, 100); this.outcome("A reprieve", "He grunts and writes something in his ledger. \"Three days.\"", null, { roll: r }); }
        else { beaten(); this.outcome("No more time", "He doesn't like your excuses. You'll be sore for days, and the guild hears about it.\n\n<em>−20 health · +4 trauma · −2 reputation · −3 standing</em>", null, { roll: r }); }
      } },
      { label: "Refuse", hint: "−20 health · +4 trauma · −2 rep · −3 standing", danger: true, action: () => { beaten(); this.outcome("You refuse", "He makes his point the old way, then leaves.", null); } }
    ]);
  },

  travel(id) {
    const to = city(id);
    const cost = travelCost(id);
    if (state.rank < to.rank || state.coin < cost || id === state.city) { this.menu(); return; }
    const from = city().name;
    state.coin -= cost;
    state.city = id;
    const first = !state.visited[id];
    state.visited[id] = true;
    state.phase = "night";
    this.advanceClock();
    this.log(`Travelled from ${from} to ${to.name}.`);
    const arrive = `You leave ${from} and travel through the night, arriving in ${to.name}, ${to.kind}, as dawn breaks.${first ? `\n\n<em>${to.blurb.morning}</em>` : ""}`;
    if (Math.random() < 0.3) { this.roadEvent(arrive); return; }
    this.dawnReport(arrive);
  },

  roadEvent(arrive) {
    const sm = attrMeta("str", { bonus: state.upgrades.bodyguard ? 2 : 0 }), pm = skillMeta("persuasion");
    const done = text => this.dawnReport(text + "\n\n" + arrive);
    const roll = Math.random();
    this.setMode("event");
    if (roll < 0.5) {
      UI.scene({ kicker: "On the road", title: "Highwaymen", body: "Two masked riders block the road and demand your purse." });
      UI.choices([
        { label: "Fight them off", hint: "STR · fail: hurt and robbed", odds: odds(sm, 13), action: () => {
          const r = check(sm, 13);
          if (r.success) done("You lay one out with your bag and the other thinks better of it.");
          else { const lost = Math.floor(state.coin / 3); state.coin -= lost; state.health = Math.max(0, state.health - hurtAmt(15)); done(`They take ${lost} coin and leave you bruised in the ditch.`); }
        } },
        { label: "Charm them", hint: "Persuasion · fail: robbed", odds: odds(pm, 14), action: () => {
          const r = check(pm, 14);
          if (r.success) done("By the end of it they're escorting you to the next inn and apologizing.");
          else { const lost = Math.floor(state.coin / 3); state.coin -= lost; done(`They laugh, and take ${lost} coin anyway.`); }
        } },
        { label: "Hand over a third of your coin", quiet: true, action: () => { const lost = Math.floor(state.coin / 3); state.coin -= lost; done(`You give up ${lost} coin and keep your skin.`); } }
      ]);
    } else if (roll < 0.8) {
      state.fame += 2;
      learnPosition(pick(INDEX.positions).id);
      done("You share a coach with a retired courtesan who spends the journey telling stories. You arrive wiser, and she promises to mention your name.");
    } else {
      state.energy = Math.max(0, state.energy - 20);
      done("A storm turns the road to mud. You arrive soaked and exhausted.");
    }
  },

  /* ---------- Actions ---------- */
  rest() {
    if (state.flags.restedThisPhase) return this.refresh();
    state.flags.restedThisPhase = true;
    const worked = state.flags.clientsThisPhase > 0;
    let gain = worked ? 22 : 12;
    if (state.classFeatures.quickRecovery) gain += 8;
    if (state.classFeatures.restful) gain += 5;
    if (state.classFeatures.restless) gain -= 6;
    state.energy = Math.min(100, state.energy + gain);
    state.health = Math.min(maxHealth(), state.health + (worked ? 8 : 4));
    state.stress = Math.max(0, state.stress - (worked ? 8 : 4));
    if (state.exhaustion && state.energy >= 50) state.exhaustion--;
    UI.toast(worked ? "You rest well." : "A light rest.");
    this.refresh();
  },

  payDebt() {
    const amt = Math.min(state.coin, state.debt);
    state.coin -= amt; state.debt -= amt;
    if (!state.debt) state.debtDays = 0;
    this.log(`Paid ${amt} toward debt.`);
    UI.toast(state.debt ? `Paid ${amt}. ${state.debt} left.` : "Debt cleared!");
    this.refresh();
  },

  buy(item) {
    if (state.coin < priceOf(item) || (item.once && state.upgrades[item.id])) return this.refresh();
    state.coin -= priceOf(item);
    if (item.once) state.upgrades[item.id] = true;
    // --- recovery ---
    if (item.id === "physician") state.health = Math.min(maxHealth(), state.health + 30);
    if (item.id === "physician_full") { state.health = Math.min(maxHealth(), state.health + 60); state.stress = Math.max(0, state.stress - 10); }
    if (item.id === "tonic") state.stress = Math.max(0, state.stress - 15);
    if (item.id === "strong_tonic") { state.stress = Math.max(0, state.stress - 30); state.energy = Math.min(100, state.energy + 10); }
    if (item.id === "sanctuary") { state.trauma = Math.max(0, state.trauma - 12); state.stress = Math.max(0, state.stress - 10); }
    if (item.id === "sanctuary_retreat") { state.trauma = Math.max(0, state.trauma - 25); state.stress = Math.max(0, state.stress - 20); }
    if (item.id === "bathhouse") { state.energy = Math.min(100, state.energy + 25); if (state.exhaustion) state.exhaustion--; }
    if (item.id === "private_bathhouse") { state.energy = Math.min(100, state.energy + 50); state.stress = Math.max(0, state.stress - 10); if (state.exhaustion > 0) { state.exhaustion = Math.max(0, state.exhaustion - 2); } }
    if (item.id === "massage") { state.health = Math.min(maxHealth(), state.health + 20); state.energy = Math.min(100, state.energy + 20); }
    if (item.id === "sleep_draught") { if (state.exhaustion) state.exhaustion--; state.energy = Math.min(100, state.energy + 15); }
    // --- skills & training ---
    if (item.id === "tutor_oral") state.skills.oral = Math.min(100, (state.skills.oral || 0) + 8);
    if (item.id === "tutor_kink") state.skills.kink = Math.min(100, (state.skills.kink || 0) + 8);
    if (item.id === "tutor_performance") state.skills.performance = Math.min(100, (state.skills.performance || 0) + 8);
    if (item.id === "tutor_persuasion") { state.skills.persuasion = Math.min(100, (state.skills.persuasion || 0) + 8); state.skills.insight = Math.min(100, (state.skills.insight || 0) + 5); }
    if (item.id === "anatomy_book") { for (const sk of ["oral","vaginal","anal","manual"]) state.skills[sk] = Math.min(100, (state.skills[sk] || 0) + 5); }
    if (item.id === "guild_seminar") { const sk = Object.entries(state.skills).sort((a,b) => b[1]-a[1])[0]; if (sk) state.skills[sk[0]] = Math.min(100, sk[1] + 10); }
    // --- reputation ---
    if (item.id === "guild_voucher") changeStanding(8);
    if (item.id === "advertisement") { state.reputation = Math.min(200, state.reputation + 5); state.flags.extraClients = (state.flags.extraClients || 0) + 2; }
    if (item.id === "patron_introduction") state.reputation = Math.min(200, state.reputation + 15);
    if (item.id === "calling_card") state.reputation = Math.min(200, state.reputation + 3);
    // --- private room bonus ---
    if (item.id === "private_room") { /* bonus applied via maxHealth()/maxEnergy() via state.upgrades check */ }
    this.log(`Bought: ${item.name}.`);
    UI.toast(`Bought ${item.name.toLowerCase()}.`);
    this.refresh();
  },

  /* ---------- Save / load ---------- */
  hasSave() { try { return !!localStorage.getItem("courtesan-v4"); } catch (e) { return false; } },
  save(manual) {
    if (manual && state.ironman) return;
    try {
      localStorage.setItem("courtesan-v4", JSON.stringify({ ...state, encounter: null }));
      if (manual) { UI.toast("Saved."); this.refresh(); }
    } catch (e) { if (manual) { UI.toast("Couldn't save in this browser."); this.refresh(); } }
  },
  load() {
    try {
      const raw = localStorage.getItem("courtesan-v4");
      if (!raw) { UI.toast("No save found."); return this.refresh(); }
      const merged = deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw));
      merged.knownPositions = (merged.knownPositions || []).filter(isPosition);
      if (!merged.knownPositions.length) merged.knownPositions = ["missionary"];
      merged.encounter = null;
      merged.court = null;
      if (!CITIES.some(c => c.id === merged.city)) merged.city = "saltmere";
      merged.rank = clamp(merged.rank | 0, 0, RANKS.length - 1);
      const mc = merged.character;
      mc.gender = (mc.gender === "male" || mc.gender === "man") ? "male" : "female";
      if (mc.build === "curvaceous") mc.build = "sturdy";
      if (!BUILDS[mc.build]) mc.build = "average";
      if (!mc.name) mc.name = pick(NAMES[mc.gender]);
      if (!merged.knownKinks || !merged.knownKinks.length) merged.knownKinks = [...(CLASS_KINKS[mc.class] || [])];
      Object.keys(state).forEach(k => delete state[k]);
      Object.assign(state, merged);
      UI.skipDeltas = true;
      UI.toast("Loaded.");
      UI.tab = "work"; $("work").hidden = false; $("view").hidden = true;
      this.menu();
    } catch (e) { UI.toast("That save couldn't be read."); this.refresh(); }
  },

  newGame() {
    if (state.ironman) { try { localStorage.removeItem("courtesan-v4"); } catch (e) { /* ignore */ } }
    const fresh = JSON.parse(JSON.stringify(DEFAULT_STATE));
    Object.keys(state).forEach(k => delete state[k]);
    Object.assign(state, fresh);
    this.lastRoll = null;
    this.hook = null;
    UI.skipDeltas = true;
    UI.tab = "work"; $("work").hidden = false; $("view").hidden = true;
    Creation.start(true);
  }
};

function nameOf(id) { const p = anyItem(id); return p ? p.name : id; }

function featReqText(f) {

function featReqMet(t, f) {
  if (!f.req) return true;
  return Object.keys(f.req).every(k => k === "skill"
    ? Object.keys(f.req.skill).every(s => (t.skills[s] || 0) >= f.req.skill[s])
    : (t.attributes[k] || 0) >= f.req[k]);

const POINT_BUDGET = 27;

const MAX_FLAWS = 3, MAX_STRENGTHS = 3, MAX_SPECS = 2, MAX_LIMITS = 2;
function pointsSpent(a) { return ATTR_KEYS.reduce((s, k) => s + POINT_COST[a[k]], 0); }
function traitPointsLeft(d) {
  let p = (d.limits || []).length;
  d.traits.forEach(id => {
    const n = TRAITS.neg.find(x => x.id === id), q = TRAITS.pos.find(x => x.id === id);
    if (n) p += n.grant;
    if (q) p -= q.cost;
  });
  if (d.feat && FEATS[d.feat]) p -= FEATS[d.feat].cost;
  return p;
}
function learnFor(t, id) { if (isPosition(id) && !t.knownPositions.includes(id)) t.knownPositions.push(id); }
function bonusFor(t, skill) {
  const raw = t.skills[skill] || 0;
  return getMod(t.attributes[SKILL_ATTR[skill]]) + (raw >= 20 ? t.proficiencyBonus : 0) + Math.floor(raw / 25);
}

// Applies a creation draft to a fresh state object. Pure with respect to the draft.
function applyDraft(t, d) {
  Object.assign(t.character, {
    name: d.name, gender: d.gender, clientele: d.clientele, appearance: d.appearance, build: d.build,
    hair: d.hair, eyes: d.eyes, mark: d.mark, voice: d.voice, body: { ...BODY_DEFAULT, ...(d.body || {}) }, experience: d.difficulty,
    class: d.cls, subclass: d.sub, background: d.background, motivation: d.motive,
    specialties: [...(d.specs || [])], limits: [...(d.limits || [])],
    traits: [...d.traits], feat: d.feat && FEATS[d.feat] ? FEATS[d.feat].name : null,
    likes: (() => {
      const pool = Object.keys(TECH_INFO).filter(id => !(d.limits || []).includes(id));
      const out = [];
      while (out.length < 3 && pool.length) {
        const i = Math.floor(Math.random() * pool.length);
        out.push(pool.splice(i, 1)[0]);
      }
      return out;
    })()
  });
  t.attributes = { ...d.attrs };
  DIFFICULTIES[d.difficulty].apply(t);
  if (d.cls && CLASSES[d.cls]) {
    CLASSES[d.cls].apply(t);
    (CLASS_POSITIONS[d.cls] || []).slice(0, 2).forEach(id => learnFor(t, id));
    const s = d.sub && SUBCLASSES[d.cls].find(x => x.id === d.sub);

  t.knownKinks = [...new Set([...(CLASS_KINKS[d.cls] || []), ...(d.specs || [])])].filter(id => !(d.limits || []).includes(id));

  if (VOICES[d.voice]) t.classFeatures[VOICES[d.voice].feature] = true;
  if (d.background && BACKGROUNDS[d.background]) BACKGROUNDS[d.background].apply(t);
  if (d.motive && MOTIVES[d.motive] && MOTIVES[d.motive].apply) MOTIVES[d.motive].apply(t);
  d.traits.forEach(id => { const x = TRAITS.pos.find(q => q.id === id) || TRAITS.neg.find(q => q.id === id); if (x) x.apply(t); });

  if (d.feat && FEATS[d.feat]) { t.classFeatures[d.feat] = true; t.feats.push(d.feat); }
  t.traitPoints = Math.max(0, traitPointsLeft(d));
  t.ironman = !!d.ironman;
  return t;
}

    this.editing = true;

      `Traits: ${traitNames.length ? traitNames.join(", ") : "none"} · Feat: ${d.feat ? FEATS[d.feat].name : "none"}`
    ].join("\n");
    const edits = STEPS.slice(0, -1).map((s, j) => ({ label: `Edit ${STEP_NAMES[s].toLowerCase()}`, quiet: true, action: () => { this.editing = true; this.go(j); } }));

      { section: "Change something" },

  randomDraft() {

    d.name = pick(NAMES[d.gender]);
    d.appearance = pick(Object.keys(APPEARANCES));
    d.build = pick(Object.keys(BUILDS));
    d.body = {}; Object.keys(BODY).forEach(k => { d.body[k] = pick(BODY[k].opts); });
    d.hair = pick(HAIR); d.eyes = pick(EYES); d.mark = pick(Object.keys(MARKS)); d.voice = pick(Object.keys(VOICES));
    d.difficulty = pick(["novice", "experienced", "experienced", "veteran"]);
    d.cls = pick(Object.keys(CLASSES));
    d.sub = pick(SUBCLASSES[d.cls]).id;
    d.attrs = { ...CLASSES[d.cls].rec };
    d.background = pick(Object.keys(BACKGROUNDS));
    d.motive = pick(Object.keys(MOTIVES));
    const ks = shuffle(INDEX.kinks.map(k => k.id));
    d.specs = ks.slice(0, Math.floor(Math.random() * 3));
    d.limits = ks.slice(2, 2 + Math.floor(Math.random() * 2));
    shuffle(TRAITS.neg).slice(0, Math.floor(Math.random() * 4)).forEach(t => d.traits.push(t.id));
    let nPos = 0;
    shuffle(TRAITS.pos).forEach(t => { if (nPos < MAX_STRENGTHS && traitPointsLeft(d) >= t.cost && Math.random() < 0.7) { d.traits.push(t.id); nPos++; } });
    const sheet = applyDraft(freshState(), d);
    const feats = Object.keys(FEATS).filter(k => FEATS[k].cost <= traitPointsLeft(d) && featReqMet(sheet, FEATS[k]));
    if (feats.length && Math.random() < 0.7) d.feat = pick(feats);
    return d;
  },

  finish() {
    const d = this.d;
    if (!d.name) d.name = pick(NAMES[d.gender]);
    const next = applyDraft(freshState(), d);
    Object.keys(state).forEach(k => delete state[k]);
    Object.assign(state, next);
    this.editing = false; this.prevVals = null;
    UI.skipDeltas = true;
    const c = state.character;
    Game.log(`${c.name} began a new life: ${classLabel(c.class)} (${c.subclass}), ${c.background}.`);
    Game.outcome("The streets await",
      `You are <b>${esc(c.name)}</b>, ${an(c.appearance)} ${c.appearance} ${buildWord(c.build).toLowerCase()} ${pr("noun")} with ${String(c.hair).toLowerCase()} hair — ${an(classLabel(c.class))} ${classLabel(c.class)} of the ${c.subclass} school, once ${an(c.background)} ${c.background.toLowerCase()}.\n\n${MOTIVES[c.motivation].intro}\n\nYou arrive in Saltmere with ${state.coin} coin and a letter admitting you to the Courtesan's Guild as an Initiate. The guild sells sex. You sell it with them. Satisfy clients, earn Standing, and face rank trials — each rank opens new cities and better-paying beds. Perform badly and you'll be demoted, or cast out entirely.${state.ironman ? "\n\n<b>Ironman.</b> One life, no reloading." : ""}\n\n<em>Tip: size clients up before you commit. The percentage on each choice is your chance of success.</em>`,
      () => Game.menu(), { kicker: "Day 1", cta: "Begin" });
  }
};

UI.renderTabs();
Creation.start(false);
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !/CourtesanApp/.test(navigator.userAgent)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
